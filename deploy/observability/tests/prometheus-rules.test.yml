# Run: docker run --rm -v "$PWD/deploy/observability:/r" --entrypoint /otel-lgtm/prometheus/promtool grafana/otel-lgtm:0.39.0 test rules /r/tests/prometheus-rules.test.yml
# A counter is created on its first error, so the series is born at 1: the paging rules must fire on that first error.
rule_files:
  - ../prometheus-rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'landflow_process_errors_total{kind="unhandledRejection"}'
        values: '_ _ _ 1 1 1 1 1 1 1'
      - series: 'landflow_audit_write_failures_total{action="credential.create"}'
        values: '_ _ _ 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: LandflowProcessErrors
        exp_alerts:
          - exp_labels: { kind: unhandledRejection, severity: page }
            exp_annotations:
              summary: "A process error was counted (unhandledRejection): an unhandled rejection, an uncaught exception or a service that failed to start"
              runbook: docs/observability.md#alerts-and-dashboard
      - eval_time: 5m
        alertname: LandflowAuditWriteFailures
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: Audit events could not be stored
              runbook: docs/observability.md#alerts-and-dashboard
      - eval_time: 30m
        alertname: LandflowProcessErrors
        exp_alerts: []
# The cache alert reads a 1 h rate against a 7 d average. The series run 27 h (the 7 d window is only partly filled,
# which is the same average of what exists); the last 3 h are the drop. Input is one counter of the whole prompt.
# Firing: 20,000 input tokens a minute (1.2 M an hour), 80% read from the cache, then 8% for the last 3 hours.
  - interval: 1m
    input_series:
      - series: 'landflow_ai_tokens_total{gen_ai_system="anthropic",gen_ai_token_type="input"}'
        values: '0+20000x1620'
      - series: 'landflow_ai_tokens_total{gen_ai_system="anthropic",gen_ai_token_type="cache_read"}'
        values: '0+16000x1440 23041600+1600x179'
    alert_rule_test:
      - eval_time: 1620m
        alertname: LandflowAiCacheHitRateDropped
        exp_alerts:
          - exp_labels: { severity: warn }
            exp_annotations:
              summary: The Anthropic prompt-cache hit rate over 1 hour is under half its 7-day average (at over 100,000 input tokens an hour)
              runbook: docs/observability.md#alerts-and-dashboard
      - eval_time: 1400m
        alertname: LandflowAiCacheHitRateDropped
        exp_alerts: []
# Quiet, low volume: the same drop at 1,000 input tokens a minute (60,000 an hour, under the 100,000 guard).
  - interval: 1m
    input_series:
      - series: 'landflow_ai_tokens_total{gen_ai_system="anthropic",gen_ai_token_type="input"}'
        values: '0+1000x1620'
      - series: 'landflow_ai_tokens_total{gen_ai_system="anthropic",gen_ai_token_type="cache_read"}'
        values: '0+800x1440 1152800+80x179'
    alert_rule_test:
      - eval_time: 1620m
        alertname: LandflowAiCacheHitRateDropped
        exp_alerts: []
# Quiet, normal rate: high volume and a steady 80% hit rate all along.
  - interval: 1m
    input_series:
      - series: 'landflow_ai_tokens_total{gen_ai_system="anthropic",gen_ai_token_type="input"}'
        values: '0+20000x1620'
      - series: 'landflow_ai_tokens_total{gen_ai_system="anthropic",gen_ai_token_type="cache_read"}'
        values: '0+16000x1620'
    alert_rule_test:
      - eval_time: 1620m
        alertname: LandflowAiCacheHitRateDropped
        exp_alerts: []
