# Landflow packaged as images: the host plus the eight plugins, each announcing itself to the
# host's registry by its service name, and the sandboxed code runner the Code node uses.
#
#   docker compose -f deploy/compose.yml up -d --build --wait     # http://localhost:53000
#   docker compose -f deploy/compose.yml -f deploy/compose.infra-link.yml up -d   # + join the infra network
#
# Builds use the repository root as context (see deploy/docker/*.Dockerfile and /.dockerignore).
# Settings: deploy/.env (see .env.example). Details: docs/deployment.md.

name: landflow

x-plugin: &plugin
  restart: unless-stopped
  init: true
  depends_on:
    web:
      condition: service_started
  networks: [landflow]
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-plugin-env: &plugin-env
  LANDFLOW_REGISTRY_URL: http://web:3000
  LANDFLOW_LOG_LEVEL: ${LANDFLOW_LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${LANDFLOW_OTLP_ENDPOINT:-}
  # Transports (docs/transports.md): the faces a plugin serves. Default http,grpc; to add brokers set LANDFLOW_PLUGIN_TRANSPORTS
  # (for example http,grpc,nats) and add LANDFLOW_<KIND>_URL for each kind here (for example LANDFLOW_NATS_URL: nats://nats:4222;
  # the infra brokers are reachable by service name once the app is joined to the infra network). Over a broker calls are encrypted
  # and signed with the transport secret, which must equal the host's LANDFLOW_TRANSPORT_SECRET.
  LANDFLOW_TRANSPORTS: ${LANDFLOW_PLUGIN_TRANSPORTS:-http,grpc}
  LANDFLOW_TRANSPORT_SECRET: ${LANDFLOW_TRANSPORT_SECRET:-}
  # Claim check (protocol §14.6): bodies too big for a broker go by reference through an S3-compatible bucket. Set the same
  # three values here and on web (for MinIO on the infra stack: s3://landflow/claims?endpoint=http://host.docker.internal:59000&forcePathStyle=true).
  LANDFLOW_CLAIM_STORE: ${LANDFLOW_CLAIM_STORE:-}
  LANDFLOW_CLAIM_ACCESS_KEY_ID: ${LANDFLOW_CLAIM_ACCESS_KEY_ID:-}
  LANDFLOW_CLAIM_SECRET_ACCESS_KEY: ${LANDFLOW_CLAIM_SECRET_ACCESS_KEY:-}
  # The plugin's own MCP face is off in containers: agents reach plugins through the host's per-plugin endpoints and the bundled
  # gateway. To turn it on set LANDFLOW_PLUGIN_MCP=on and LANDFLOW_PLUGIN_MCP_TOKEN (a container listens on 0.0.0.0, so a token is required).
  LANDFLOW_MCP: ${LANDFLOW_PLUGIN_MCP:-off}
  LANDFLOW_MCP_TOKEN: ${LANDFLOW_PLUGIN_MCP_TOKEN:-}

services:
  web:
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/host:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/host.Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_HOST_PORT:-53000}:3000"
      # The MCP gateway sidecar below shares this container's network namespace, so its /mcp listener is published here.
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_MCP_GATEWAY_PORT:-54000}:4000"
    environment:
      LANDFLOW_DATA_DIR: /data
      # The bundled MCP gateway (docs/transports.md): the sidecar's admin API and this host, both on the shared loopback;
      # the secret is what the gateway sends as `x-landflow-gateway`; the public URL is where agents connect.
      LANDFLOW_MCP_GATEWAY: ${LANDFLOW_MCP_GATEWAY:-bundled}
      LANDFLOW_MCP_GATEWAY_ADMIN_URL: http://127.0.0.1:15000
      LANDFLOW_MCP_GATEWAY_HOST_URL: http://127.0.0.1:3000
      LANDFLOW_MCP_GATEWAY_PUBLIC_URL: ${LANDFLOW_MCP_GATEWAY_PUBLIC_URL:-http://localhost:${LANDFLOW_MCP_GATEWAY_PORT:-54000}}
      LANDFLOW_MCP_GATEWAY_SECRET: ${LANDFLOW_MCP_GATEWAY_SECRET:-landflow-mcp-gateway-dev-only-secret}
      # Empty: the vault generates a key into the data volume (/data/encryption.key) on first use.
      LANDFLOW_ENCRYPTION_KEY: ${LANDFLOW_ENCRYPTION_KEY:-}
      LANDFLOW_LOG_LEVEL: ${LANDFLOW_LOG_LEVEL:-info}
      # Plugins announce themselves; the scan (at boot and the Plugins page's "Scan network")
      # probes the plugin services instead of the container's own 127.0.0.1.
      LANDFLOW_SCAN_HOSTS: text-toolkit,py-insights,go-crypto,messaging,productivity,google-workspace,databases,github,browser,agent-shell,web-search
      LANDFLOW_SCAN_PORTS: 7101-7107,7111-7114,7201-7207,7211-7214
      # Base of links the host hands out (resume URLs, error-workflow links): the published port.
      LANDFLOW_PUBLIC_URL: http://localhost:${LANDFLOW_HOST_PORT:-53000}
      # Where plugins fetch and upload item files (/api/binary): the host on the compose network.
      LANDFLOW_INTERNAL_URL: http://web:3000
      # Files live under /data/binary; LANDFLOW_BINARY_STORE=s3 with LANDFLOW_S3_* moves them to S3 or MinIO.
      LANDFLOW_BINARY_STORE: ${LANDFLOW_BINARY_STORE:-filesystem}
      # The broker claim check (see x-plugin-env): the same store as the plugins, or none.
      LANDFLOW_CLAIM_STORE: ${LANDFLOW_CLAIM_STORE:-}
      LANDFLOW_CLAIM_ACCESS_KEY_ID: ${LANDFLOW_CLAIM_ACCESS_KEY_ID:-}
      LANDFLOW_CLAIM_SECRET_ACCESS_KEY: ${LANDFLOW_CLAIM_SECRET_ACCESS_KEY:-}
      # Marketplace node plugins run as child processes inside this container.
      LANDFLOW_MARKETPLACE_REGISTRY_URL: http://127.0.0.1:3000
      OLLAMA_URL: ${LANDFLOW_OLLAMA_URL:-http://host.docker.internal:11434}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LANDFLOW_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: landflow-host
      LANDFLOW_TRACE_URL: ${LANDFLOW_TRACE_URL:-http://localhost:56686/trace/{traceId}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Code node sandbox: the code-runner service below. In-process JavaScript (node:vm, not isolated) is off here
      # unless LANDFLOW_CODE_IN_PROCESS=true.
      LANDFLOW_CODE_RUNNER_URL: http://code-runner:7300
      LANDFLOW_CODE_RUNNER_SECRET: ${LANDFLOW_CODE_RUNNER_SECRET:-landflow-code-runner-dev-only}
      LANDFLOW_CODE_IN_PROCESS: ${LANDFLOW_CODE_IN_PROCESS:-false}
      # Sign-in (docs/features/authentication.md): boot creates this owner when the data volume has no user yet, so the stack
      # (and deploy/scripts/smoke.sh) can sign in. Development values: set your own, or blank both to use /setup.
      LANDFLOW_OWNER_EMAIL: ${LANDFLOW_OWNER_EMAIL-owner@landflow.test}
      LANDFLOW_OWNER_PASSWORD: ${LANDFLOW_OWNER_PASSWORD-landflow-dev-only}
      LANDFLOW_OWNER_NAME: ${LANDFLOW_OWNER_NAME:-Owner}
      # Invites and password resets by email through the infra stack's Mailpit (unset: Settings shows links to copy).
      # LANDFLOW_SMTP_HOST: host.docker.internal        # or mailpit, port 1025, with compose.infra-link.yml
      # LANDFLOW_SMTP_PORT: "51025"
      # LANDFLOW_SMTP_FROM: Landflow <landflow@landflow.test>
      # Single sign-on through the infra stack's Keycloak (profile auth). The issuer is the URL browsers use; the
      # discovery URL is how this container reaches Keycloak (http://keycloak:8080/... with compose.infra-link.yml).
      # LANDFLOW_OIDC_ISSUER: http://localhost:58080/realms/landflow
      # LANDFLOW_OIDC_DISCOVERY_URL: http://host.docker.internal:58080/realms/landflow/.well-known/openid-configuration
      # LANDFLOW_OIDC_CLIENT_ID: landflow
      # LANDFLOW_OIDC_CLIENT_SECRET: landflow-dev-client-secret
      # LANDFLOW_OIDC_ROLE_MAP: landflow-admin=admin,landflow-editor=member
      # Require a shared secret from plugins that register (add the same LANDFLOW_REGISTRY_SECRET to x-plugin-env).
      # LANDFLOW_REGISTRY_SECRET: change-me
    volumes:
      - landflow-data:/data
    networks: [landflow, code]
    depends_on:
      code-runner:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The bundled MCP gateway (agentgateway 1.6, docs/transports.md "Deployment"): a sidecar in the web container's network
  # namespace, so the host writes its targets on 127.0.0.1:15000 (no authentication, never published) and the targets
  # reach the host on 127.0.0.1:3000. /mcp is published through `web` on LANDFLOW_MCP_GATEWAY_PORT. Base config
  # mcp-gateway/config.sidecar.yaml (storage mode hybrid); the targets live in SQLite on the volume and are rebuilt from
  # the plugin registry by the host's gateway sync. Distroless image (no shell, no healthcheck); same digest as compose.infra.yml.
  mcp-gateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    restart: unless-stopped
    network_mode: service:web
    command: ["-f", "/config/config.yaml"]
    volumes:
      - ./mcp-gateway/config.sidecar.yaml:/config/config.yaml:ro
      - landflow-mcp-gateway-data:/data
    depends_on:
      web:
        condition: service_started
      mcp-gateway-init:
        condition: service_completed_successfully

  mcp-gateway-init:
    # Gives the data volume to the gateway's user (65532); the image has no shell to do it itself.
    image: alpine:3.22
    command: ["chown", "65532:65532", "/data"]
    volumes:
      - landflow-mcp-gateway-data:/data

  text-toolkit:
    <<: *plugin
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-text-toolkit:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/node-plugin.Dockerfile
      args: { PLUGIN: text-toolkit, HTTP_PORT: "7101", GRPC_PORT: "7201" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: text-toolkit

  py-insights:
    <<: *plugin
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-py-insights:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/python-plugin.Dockerfile
      args: { PLUGIN: py-insights, HTTP_PORT: "7102", GRPC_PORT: "7202" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: py-insights

  go-crypto:
    <<: *plugin
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-go-crypto:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/go-plugin.Dockerfile
      args: { PLUGIN: go-crypto, HTTP_PORT: "7103", GRPC_PORT: "7203" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: go-crypto

  messaging:
    <<: *plugin
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-messaging:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/node-plugin.Dockerfile
      args: { PLUGIN: messaging, HTTP_PORT: "7104", GRPC_PORT: "7204" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: messaging

  productivity:
    <<: *plugin
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-productivity:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/python-plugin.Dockerfile
      args: { PLUGIN: productivity, HTTP_PORT: "7105", GRPC_PORT: "7205" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: productivity

  google-workspace:
    <<: *plugin
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-google-workspace:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/go-plugin.Dockerfile
      args: { PLUGIN: google-workspace, HTTP_PORT: "7106", GRPC_PORT: "7206" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: google-workspace

  databases:
    <<: *plugin
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-databases:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/go-plugin.Dockerfile
      args: { PLUGIN: databases, HTTP_PORT: "7107", GRPC_PORT: "7207" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: databases

  github:
    <<: *plugin
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-github:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/node-plugin.Dockerfile
      args: { PLUGIN: github, HTTP_PORT: "7111", GRPC_PORT: "7211" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: github

  # Browser plugin (plugins/browser): its own image with Chrome and the agent-browser CLI (plugins/browser/Dockerfile).
  # Optional: the profile `browser` keeps it out of a plain `up` (the image is large); add `--profile browser`. It runs
  # headless in a container. Set LANDFLOW_BROWSER_ALLOWED_DOMAINS (comma separated) to limit every node to those sites;
  # empty, a node's own list (default: its URL's site) is the only limit.
  browser:
    <<: *plugin
    profiles: [browser]
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-browser:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: plugins/browser/Dockerfile
      args: { HTTP_PORT: "7112", GRPC_PORT: "7212" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: browser
      LANDFLOW_BROWSER_ALLOWED_DOMAINS: ${LANDFLOW_BROWSER_ALLOWED_DOMAINS:-}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    shm_size: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: ${LANDFLOW_BROWSER_MEM_LIMIT:-2g}

  # Agent Shell plugin (plugins/agent-shell): just-bash, a simulated bash over an in-memory filesystem; no host files, no
  # network. Optional: the profile `agent-shell` keeps it out of a plain `up`.
  agent-shell:
    <<: *plugin
    profiles: [agent-shell]
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-agent-shell:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/node-plugin.Dockerfile
      args: { PLUGIN: agent-shell, HTTP_PORT: "7114", GRPC_PORT: "7214" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: agent-shell
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Web Search plugin (plugins/web-search): SearXNG, Brave Search or Tavily; keys live in saved credentials. Optional:
  # the profile `web-search`. LANDFLOW_SEARCH_SEARXNG_URL is the SearXNG base URL (no default here: name your instance),
  # LANDFLOW_SEARCH_DENY_DOMAINS the operator's deny-list (comma separated).
  web-search:
    <<: *plugin
    profiles: [web-search]
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-web-search:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/node-plugin.Dockerfile
      args: { PLUGIN: web-search, HTTP_PORT: "7113", GRPC_PORT: "7213" }
    environment:
      <<: *plugin-env
      LANDFLOW_ADVERTISE_HOST: web-search
      LANDFLOW_SEARCH_SEARXNG_URL: ${LANDFLOW_SEARCH_SEARXNG_URL:-}
      LANDFLOW_SEARCH_DENY_DOMAINS: ${LANDFLOW_SEARCH_DENY_DOMAINS:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Sandboxed Code node runner (services/code-runner): every JavaScript or Python snippet runs in a fresh child
  # process. The container is the security boundary: it joins only the internal `code` network (no route out; the
  # host reaches it as code-runner:7300), its root filesystem is read-only apart from a noexec /tmp, and it has no
  # capabilities, no privilege escalation and capped processes, memory and CPU.
  code-runner:
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/code-runner:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/code-runner.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: ${LANDFLOW_CODE_RUNNER_MEM_LIMIT:-1g}
    cpus: ${LANDFLOW_CODE_RUNNER_CPUS:-2}
    environment:
      CODE_RUNNER_SECRET: ${LANDFLOW_CODE_RUNNER_SECRET:-landflow-code-runner-dev-only}
      CODE_RUNNER_TIMEOUT_MS: ${LANDFLOW_CODE_RUNNER_TIMEOUT_MS:-60000}
      CODE_RUNNER_MEMORY_MB: ${LANDFLOW_CODE_RUNNER_MEMORY_MB:-256}
      CODE_RUNNER_MAX_BINARY_BYTES: ${LANDFLOW_CODE_RUNNER_MAX_BINARY_BYTES:-6291456}
      CODE_RUNNER_CONCURRENCY: ${LANDFLOW_CODE_RUNNER_CONCURRENCY:-2}
    networks: [code]

  # Publishes the runner on the Mac (127.0.0.1:53300) for a dev server outside Docker: Docker publishes no ports for
  # a container that is only on an internal network. It forwards that one port to code-runner:7300 and nowhere else.
  code-runner-port:
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/code-runner:${LANDFLOW_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 64m
    command: ["node", "dist/forward.mjs"]
    environment:
      CODE_RUNNER_FORWARD_TARGET: code-runner:7300
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_CODE_RUNNER_PORT:-53300}:7300"
    depends_on:
      code-runner:
        condition: service_started
    networks: [code, code-port]

networks:
  landflow:
    name: landflow-app
  # The code runner's network: the host and the runner only. `internal` takes away the route out; the isolated
  # gateway mode (Docker Engine 28.2+) also gives the bridge no address on the Docker host, which an internal network
  # otherwise keeps: without it a snippet could reach any port the host (or another project) publishes on 0.0.0.0.
  code:
    name: landflow-code
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  # Lets code-runner-port publish its port (published ports need a non-internal network).
  code-port:
    name: landflow-code-port

volumes:
  landflow-data:
  landflow-mcp-gateway-data:
