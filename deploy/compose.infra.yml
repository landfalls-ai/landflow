# Landflow development and test infrastructure.
#
#   docker compose -f deploy/compose.infra.yml up -d                                         # core services
#   docker compose -f deploy/compose.infra.yml --profile auth --profile observability up -d  # + Keycloak, Jaeger
#   docker compose -f deploy/compose.infra.yml --profile mysql up -d mysql                   # + MySQL 8.4
#   docker compose -f deploy/compose.infra.yml --profile mail up -d greenmail                # + GreenMail (IMAP + SMTP test server)
#   docker compose -f deploy/compose.infra.yml --profile siem up -d siem                     # + Vector (syslog + HTTP audit log receiver)
#   docker compose -f deploy/compose.infra.yml --profile aws up -d localstack                # + LocalStack (AWS Secrets Manager)
#   docker compose -f deploy/compose.infra.yml --profile kafka --profile rabbitmq --profile nats up -d   # + tier 1 brokers
#   docker compose -f deploy/compose.infra.yml --profile git up -d git-ssh                    # + throwaway SSH Git server (run infra/git/gen-keys.sh first)
#   docker compose -f deploy/compose.infra.yml --profile valkey-cluster up -d --wait         # + a 6-node Valkey Cluster (3 primaries, 3 replicas) on 127.0.0.1:56411-56416
#   ... profiles mqtt, artemis, pulsar, pubsub, servicebus (tier 2 brokers), mcp-gateway (agentgateway), llm-gateway (agentgateway in front of the models)
#
# Ports, credentials and URLs: docs/deployment.md. Defaults live here; deploy/.env overrides them.
# Every credential is for local development only.

name: landflow-infra

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

x-valkey-cluster-node: &valkey-cluster-node
  image: valkey/valkey:8-alpine
  profiles: [valkey-cluster]
  restart: unless-stopped
  # Anonymous volume: a node that is stopped and started again keeps its cluster identity (`down -v` removes it).
  volumes: [/data]
  healthcheck:
    test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANDFLOW_POSTGRES_USER:-landflow}
      POSTGRES_PASSWORD: ${LANDFLOW_POSTGRES_PASSWORD:-landflow-dev-only}
      POSTGRES_DB: ${LANDFLOW_POSTGRES_DB:-landflow}
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: during first-time init the entrypoint runs a socket-only server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      <<: *healthcheck

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_VALKEY_PORT:-56379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      <<: *healthcheck

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      # Accept any SMTP user/password (and none), without TLS: a sink for the Send Email node.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_SMTP_PORT:-51025}:1025"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_MAIL_UI_PORT:-58025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      <<: *healthcheck

  minio:
    # The upstream minio/minio images are no longer published; pgsty/minio is a maintained
    # community build of the same server (with the full console). Same env vars and API.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    init: true
    # Server plus the bucket (created idempotently on every start): see infra/minio/start.sh.
    entrypoint: ["/bin/sh", "/landflow/start.sh"]
    environment:
      MINIO_ROOT_USER: ${LANDFLOW_MINIO_ROOT_USER:-landflow}
      MINIO_ROOT_PASSWORD: ${LANDFLOW_MINIO_ROOT_PASSWORD:-landflow-dev-only}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${LANDFLOW_MINIO_CONSOLE_PORT:-59001}
      LANDFLOW_BUCKET: ${LANDFLOW_MINIO_BUCKET:-landflow}
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_MINIO_PORT:-59000}:9000"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
      - ./infra/minio/start.sh:/landflow/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/landflow-ready && curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/ready"]
      <<: *healthcheck

  openbao:
    image: openbao/openbao:latest
    restart: unless-stopped
    # Dev mode (in-memory, unsealed) plus the landflow/ KV v2 mount: see infra/openbao/dev.sh.
    entrypoint: ["/usr/bin/dumb-init", "/bin/sh", "/landflow/dev.sh"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${LANDFLOW_OPENBAO_ROOT_TOKEN:-landflow-dev-root-token}
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_OPENBAO_PORT:-58200}:8200"
    volumes:
      - ./infra/openbao/dev.sh:/landflow/dev.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/landflow-ready && BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null"]
      <<: *healthcheck

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: [auth]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${LANDFLOW_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LANDFLOW_KEYCLOAK_ADMIN_PASSWORD:-admin-dev-only}
      KC_HEALTH_ENABLED: "true"
      # Browser-facing URL (issuer, login pages). Containers on the landflow-infra network can
      # still call http://keycloak:8080 for the token/userinfo/JWKS endpoints.
      KC_HOSTNAME: http://localhost:${LANDFLOW_KEYCLOAK_PORT:-58080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_KEYCLOAK_PORT:-58080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/landflow-realm.json:/opt/keycloak/data/import/landflow-realm.json:ro
    healthcheck:
      # No curl in the image: plain HTTP over bash's /dev/tcp to the management port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      <<: *healthcheck
      start_period: 60s

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observability]
    restart: unless-stopped
    # In-memory storage: traces are gone after a restart.
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_JAEGER_UI_PORT:-56686}:16686"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_JAEGER_OTLP_HTTP_PORT:-54318}:4318"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_JAEGER_OTLP_GRPC_PORT:-54317}:4317"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      <<: *healthcheck

  mysql:
    image: mysql:8.4.11
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LANDFLOW_MYSQL_ROOT_PASSWORD:-landflow-root-dev-only}
      MYSQL_DATABASE: ${LANDFLOW_MYSQL_DATABASE:-landflow_test}
      MYSQL_USER: ${LANDFLOW_MYSQL_USER:-landflow}
      MYSQL_PASSWORD: ${LANDFLOW_MYSQL_PASSWORD:-landflow-dev-only}
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_MYSQL_PORT:-53306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP, not the socket: the entrypoint's temporary init server has networking off.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      <<: *healthcheck
      start_period: 30s

  greenmail:
    # IMAP and SMTP test server for the Email Trigger (IMAP): in-memory, any user/password logs in (and is
    # created on first use). SMTP delivers to local mailboxes; Mailpit stays the sink for the Send Email node.
    image: greenmail/standalone:2.1.3
    profiles: [mail]
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_GREENMAIL_IMAP_PORT:-53143}:3143"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_GREENMAIL_SMTP_PORT:-53025}:3025"
    healthcheck:
      # The IMAP greeting over bash's /dev/tcp (no curl or nc in the image).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3143 && read -r -t 3 greeting <&3 && [[ \"$$greeting\" == *OK* ]]"]
      <<: *healthcheck

  siem:
    # A SIEM stand-in for audit log streaming: syslog (RFC 5424, TCP and UDP) and HTTP JSON lines in, JSON out on
    # stdout and in files under the siem-data volume. See infra/vector/vector.yaml.
    image: timberio/vector:0.46.1-alpine
    profiles: [siem]
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_SIEM_SYSLOG_PORT:-55514}:5514/tcp"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_SIEM_SYSLOG_PORT:-55514}:5514/udp"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_SIEM_HTTP_PORT:-55080}:8080"
    volumes:
      - ./infra/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - siem-data:/var/lib/vector
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8686/health"]
      <<: *healthcheck

  localstack:
    # AWS Secrets Manager for the external secrets tests (LANDFLOW_INTEGRATION=aws) and SQS for the `sqs` transport driver
    # (LANDFLOW_TEST_SQS=http://127.0.0.1:54566): LocalStack, those two services only, in memory, any access key works (use
    # dummy ones, never real credentials). Pinned to 4.9, which runs without a LocalStack auth token. Published on 54566:
    # another project's LocalStack may hold 4566.
    image: localstack/localstack:4.9
    profiles: [aws]
    restart: unless-stopped
    environment:
      SERVICES: secretsmanager,sqs
      EAGER_SERVICE_LOADING: "1"
      PERSISTENCE: "0"
      SKIP_SSL_CERT_DOWNLOAD: "1"
      DISABLE_EVENTS: "1"
      LOCALSTACK_HOST: "localhost:${LANDFLOW_LOCALSTACK_PORT:-54566}"
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_LOCALSTACK_PORT:-54566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:4566/_localstack/health | grep -Eq 'secretsmanager.: .(available|running)'"]
      <<: *healthcheck

  # ------------------------------------------------------------------ Valkey Cluster (docs/features/engine.md "Queue mode")
  # Six nodes (three primaries, each with a replica), no persistence beyond the cluster's own node file, for LANDFLOW_VALKEY_CLUSTER and its test
  # (LANDFLOW_INTEGRATION=valkey-cluster). The nodes announce their container host names, which only resolve inside the
  # landflow-infra network; from this machine map them to the published ports with
  #   LANDFLOW_VALKEY_CLUSTER=127.0.0.1:56411,127.0.0.1:56412,127.0.0.1:56413
  #   LANDFLOW_VALKEY_CLUSTER_NAT=valkey-cluster-1:6379=127.0.0.1:56411,valkey-cluster-2:6379=127.0.0.1:56412,...
  # (in a container on landflow-infra: LANDFLOW_VALKEY_CLUSTER=valkey-cluster-1:6379,valkey-cluster-2:6379,valkey-cluster-3:6379).
  valkey-cluster-1:
    <<: *valkey-cluster-node
    hostname: valkey-cluster-1
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "3000", "--cluster-announce-hostname", "valkey-cluster-1", "--cluster-preferred-endpoint-type", "hostname", "--appendonly", "no", "--save", ""]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:56411:6379"

  valkey-cluster-2:
    <<: *valkey-cluster-node
    hostname: valkey-cluster-2
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "3000", "--cluster-announce-hostname", "valkey-cluster-2", "--cluster-preferred-endpoint-type", "hostname", "--appendonly", "no", "--save", ""]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:56412:6379"

  valkey-cluster-3:
    <<: *valkey-cluster-node
    hostname: valkey-cluster-3
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "3000", "--cluster-announce-hostname", "valkey-cluster-3", "--cluster-preferred-endpoint-type", "hostname", "--appendonly", "no", "--save", ""]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:56413:6379"

  valkey-cluster-4:
    <<: *valkey-cluster-node
    hostname: valkey-cluster-4
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "3000", "--cluster-announce-hostname", "valkey-cluster-4", "--cluster-preferred-endpoint-type", "hostname", "--appendonly", "no", "--save", ""]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:56414:6379"

  valkey-cluster-5:
    <<: *valkey-cluster-node
    hostname: valkey-cluster-5
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "3000", "--cluster-announce-hostname", "valkey-cluster-5", "--cluster-preferred-endpoint-type", "hostname", "--appendonly", "no", "--save", ""]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:56415:6379"

  valkey-cluster-6:
    <<: *valkey-cluster-node
    hostname: valkey-cluster-6
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "3000", "--cluster-announce-hostname", "valkey-cluster-6", "--cluster-preferred-endpoint-type", "hostname", "--appendonly", "no", "--save", ""]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:56416:6379"

  valkey-cluster-init:
    # Joins the six nodes into one cluster the first time (a no-op once cluster_state is ok), then exits.
    image: valkey/valkey:8-alpine
    profiles: [valkey-cluster]
    restart: "no"
    depends_on:
      valkey-cluster-1: { condition: service_healthy }
      valkey-cluster-2: { condition: service_healthy }
      valkey-cluster-3: { condition: service_healthy }
      valkey-cluster-4: { condition: service_healthy }
      valkey-cluster-5: { condition: service_healthy }
      valkey-cluster-6: { condition: service_healthy }
    entrypoint:
      - sh
      - -c
      - |
        if valkey-cli -h valkey-cluster-1 cluster info | grep -q cluster_state:ok; then echo cluster already formed; exit 0; fi
        nodes=""
        for i in 1 2 3 4 5 6; do nodes="$$nodes $$(getent hosts valkey-cluster-$$i | awk '{ print $$1 }'):6379"; done
        valkey-cli --cluster create $$nodes --cluster-replicas 1 --cluster-yes
        until valkey-cli -h valkey-cluster-1 cluster info | grep -q cluster_state:ok; do sleep 1; done
        echo cluster ready

  # ------------------------------------------------------------------ message brokers (docs/transports.md), one profile each
  # Development brokers for the transport layer, bound to 127.0.0.1 on 5xxxx ports. Credentials are dev-only; see
  # docs/deployment.md "Message brokers" for the ports, credentials and a test command per broker.

  kafka:
    # Kafka 4.3 in KRaft mode, one node that is broker and controller. Share groups (KIP-932, "Queues for Kafka",
    # production-ready since 4.2) are on: the share rebalance protocol plus the share.version feature (set by the
    # healthcheck once the broker is up, since the image has no hook for it). Two listeners: PLAINTEXT for containers
    # on the landflow-infra network (kafka:9092) and HOST for the Mac (localhost:59092, the same port inside and out
    # so the advertised address works from both sides).
    image: apache/kafka:4.3.2
    profiles: [kafka]
    restart: unless-stopped
    environment:
      CLUSTER_ID: landflow-dev-kraft-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:${LANDFLOW_KAFKA_PORT:-59092}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${LANDFLOW_KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xmx768m -Xms256m
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_KAFKA_PORT:-59092}:${LANDFLOW_KAFKA_PORT:-59092}"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Healthy once the broker answers; the first successful check also finalises share.version=1 (idempotent).
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 &&
          (test -f /tmp/landflow-share-ready ||
           (/opt/kafka/bin/kafka-features.sh --bootstrap-server localhost:9092 upgrade --feature share.version=1 >/dev/null 2>&1;
            touch /tmp/landflow-share-ready))
      <<: *healthcheck
      interval: 10s
      start_period: 40s

  rabbitmq:
    # RabbitMQ 4 with the management plugin (UI and HTTP API on 55673). Direct reply-to, per-message TTL and the
    # mandatory flag need no configuration.
    image: rabbitmq:4.4.0-management-alpine
    profiles: [rabbitmq]
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${LANDFLOW_RABBITMQ_USER:-landflow}
      RABBITMQ_DEFAULT_PASS: ${LANDFLOW_RABBITMQ_PASSWORD:-landflow-dev-only}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_RABBITMQ_PORT:-55672}:5672"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_RABBITMQ_MANAGEMENT_PORT:-55673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      <<: *healthcheck
      start_period: 30s

  nats:
    # NATS 2 with JetStream (file store in the volume) and the monitoring endpoint on 58222. No authentication.
    image: nats:2.15.1-alpine
    profiles: [nats]
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "--name", "landflow-dev"]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_NATS_PORT:-54222}:4222"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_NATS_MONITOR_PORT:-58222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      <<: *healthcheck

  mosquitto:
    # Mosquitto 2 (MQTT 5: shared subscriptions, message expiry, response topics). Anonymous access, development only;
    # the port is published on 127.0.0.1. Config: infra/mosquitto/mosquitto.conf.
    image: eclipse-mosquitto:2.1.2-alpine
    profiles: [mqtt]
    restart: unless-stopped
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_MQTT_PORT:-51883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-p", "1883", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      <<: *healthcheck

  artemis:
    # ActiveMQ Artemis (AMQP 1.0 on 55674, also CORE/OpenWire/STOMP/MQTT on the same acceptor; web console on 58161).
    # Addresses and queues are created on first use (auto-create is the image's default).
    image: apache/activemq-artemis:2.44.0-alpine
    profiles: [artemis]
    restart: unless-stopped
    environment:
      ARTEMIS_USER: ${LANDFLOW_ARTEMIS_USER:-landflow}
      ARTEMIS_PASSWORD: ${LANDFLOW_ARTEMIS_PASSWORD:-landflow-dev-only}
      ANONYMOUS_LOGIN: "false"
      EXTRA_ARGS: --http-host 0.0.0.0 --relax-jolokia --nio
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_ARTEMIS_AMQP_PORT:-55674}:5672"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_ARTEMIS_CONSOLE_PORT:-58161}:8161"
    volumes:
      - artemis-data:/var/lib/artemis-instance
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8161/console/"]
      <<: *healthcheck
      start_period: 40s

  pulsar:
    # Pulsar 4 standalone (broker, bookie and ZooKeeper-free metadata in one process). Binary protocol on 56650, the
    # admin REST API on 58180. Memory is capped for a laptop.
    image: apachepulsar/pulsar:4.2.5
    profiles: [pulsar]
    restart: unless-stopped
    command: ["bin/pulsar", "standalone", "--no-functions-worker", "--no-stream-storage"]
    environment:
      PULSAR_MEM: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
      PULSAR_STANDALONE_USE_ZOOKEEPER: "0"
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_PULSAR_PORT:-56650}:6650"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_PULSAR_ADMIN_PORT:-58180}:8080"
    volumes:
      - pulsar-data:/pulsar/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/admin/v2/brokers/health"]
      <<: *healthcheck
      start_period: 60s

  pubsub:
    # Google Pub/Sub emulator (gcloud SDK image, emulators variant). Project landflow-dev; no credentials. Topics and
    # subscriptions are kept in the volume. Clients: PUBSUB_EMULATOR_HOST=127.0.0.1:58085.
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:590.0.1-emulators
    profiles: [pubsub]
    restart: unless-stopped
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=${LANDFLOW_PUBSUB_PROJECT:-landflow-dev}
      - --data-dir=/data
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_PUBSUB_PORT:-58085}:8085"
    volumes:
      - pubsub-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8085/ | grep -q Ok"]
      <<: *healthcheck
      start_period: 30s

  servicebus:
    # Azure Service Bus emulator (AMQP 1.0 on 55675, management and /health on 55300) with its SQL backend below.
    # Entities are static, from infra/servicebus/Config.json (Landflow's registry, control, reply and per-plugin queues
    # and an events topic). Starting it accepts Microsoft's EULAs for the emulator and SQL (ACCEPT_EULA=Y).
    # Connection string: Endpoint=sb://localhost:55675;SharedAccessKeyName=RootManageSharedAccessKey;
    #   SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    # The image is distroless (no shell), so it has no Docker healthcheck: curl http://127.0.0.1:55300/health.
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    profiles: [servicebus]
    restart: unless-stopped
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: ${LANDFLOW_SERVICEBUS_SQL_PASSWORD:-Landflow-dev-only1}
      ACCEPT_EULA: ${LANDFLOW_SERVICEBUS_ACCEPT_EULA:-Y}
      SQL_WAIT_INTERVAL: "5"
      EMULATOR_HTTP_PORT: "5300"
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_SERVICEBUS_PORT:-55675}:5672"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_SERVICEBUS_HTTP_PORT:-55300}:5300"
    volumes:
      - ./infra/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      servicebus-sql:
        condition: service_healthy

  servicebus-sql:
    # The emulator's SQL Server. Azure SQL Edge 1.0.7 is the last tag with an arm64 image (2.0.0 and mssql/server are
    # amd64 only and would run under Rosetta); it's what Microsoft's own installer uses on Apple Silicon.
    image: mcr.microsoft.com/azure-sql-edge:1.0.7
    profiles: [servicebus]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${LANDFLOW_SERVICEBUS_ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${LANDFLOW_SERVICEBUS_SQL_PASSWORD:-Landflow-dev-only1}
    volumes:
      - servicebus-sql-data:/var/opt/mssql
    healthcheck:
      # No sqlcmd in the image: the TDS port over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1433"]
      <<: *healthcheck
      start_period: 60s

  # ------------------------------------------------------------------ MCP gateway (docs/transports.md, docs/mcp-gateway.md)

  mcp-gateway:
    # agentgateway 1.6, the bundled MCP gateway, for the dev server on :3000 (targets point at host.docker.internal).
    # MCP on 54000 (/mcp), admin API and UI on 55000 (no authentication: loopback only). Base config in
    # mcp-gateway/config.yaml; the targets live in SQLite in the mcp-gateway-data volume (storage mode hybrid) and are
    # written by the host through the admin API. Distroless image, so no Docker healthcheck: GET http://127.0.0.1:55000/.
    image: cr.agentgateway.dev/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    profiles: [mcp-gateway]
    restart: unless-stopped
    command: ["-f", "/config/config.yaml"]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_MCP_GATEWAY_PORT:-54000}:4000"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_MCP_GATEWAY_ADMIN_PORT:-55000}:15000"
    volumes:
      - ./mcp-gateway/config.yaml:/config/config.yaml:ro
      - mcp-gateway-data:/data
    depends_on:
      mcp-gateway-init:
        condition: service_completed_successfully

  mcp-gateway-init:
    # Gives the data volume to the gateway's user (65532); the image has no shell to do it itself.
    image: alpine:3.22
    profiles: [mcp-gateway]
    command: ["chown", "65532:65532", "/data"]
    volumes:
      - mcp-gateway-data:/data

  llm-gateway:
    # agentgateway 1.6 as an LLM gateway in front of the model port (docs/agents.md "Model router", docs/deployment.md): one
    # OpenAI-compatible endpoint, http://127.0.0.1:54100/v1/chat/completions, for any provider listed in llm-gateway/config.yaml
    # (a local Ollama on the host to begin with). Landflow's agents use it as an OpenAI model with this base URL.
    # The admin API and UI (http://127.0.0.1:55100/ui) have no authentication: loopback only. Distroless: no healthcheck.
    image: cr.agentgateway.dev/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    profiles: [llm-gateway]
    restart: unless-stopped
    command: ["-f", "/config/config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_LLM_GATEWAY_PORT:-54100}:3000"
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_LLM_GATEWAY_ADMIN_PORT:-55100}:15000"
    volumes:
      - ./llm-gateway/config.yaml:/config/config.yaml:ro

  git-ssh:
    # A throwaway SSH Git server (user `git`, key login only) for Settings → Source control's SSH tests. Dev only:
    # run infra/git/gen-keys.sh first; its public keys are the authorized keys. Bound to 127.0.0.1.
    image: alpine:3.22
    profiles: [git]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "${LANDFLOW_BIND_ADDR:-127.0.0.1}:${LANDFLOW_GIT_SSH_PORT:-52222}:22"
    volumes:
      - ./infra/git/entrypoint.sh:/entrypoint.sh:ro
      - ./infra/git/keys:/keys:ro
      - git-ssh-host:/etc/ssh/hostkeys
      - git-ssh-repos:/srv/git
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      <<: *healthcheck

networks:
  default:
    # Fixed name so the app stack can join it (compose.infra-link.yml).
    name: landflow-infra

volumes:
  postgres-data:
  valkey-data:
  mailpit-data:
  minio-data:
  keycloak-data:
  mysql-data:
  siem-data:
  kafka-data:
  rabbitmq-data:
  nats-data:
  mosquitto-data:
  artemis-data:
  pulsar-data:
  pubsub-data:
  servicebus-sql-data:
  mcp-gateway-data:
  git-ssh-host:
  git-ssh-repos:
