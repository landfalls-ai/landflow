# LiteLLM's config for the `llm-gateway` profile (docs/llm-gateway.md). Mounted at /app/config.yaml.
#
# Add a model: append an entry to model_list. `model_name` is the name a client sends, and every model name a client sends
# must be listed here. `ollama_chat/<model>` serves both /v1/messages and /v1/chat/completions. Ollama models have no
# price, so LiteLLM reports a cost of 0 for them; Landflow prices them from its own table.
# Restart the service after a change: `docker --context orbstack compose -p landflow-infra -f deploy/compose.infra.yml
# --profile llm-gateway restart llm-gateway`.
model_list:
  - model_name: qwen3-coder:30b
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://host.docker.internal:11434
    model_info:
      supports_function_calling: true
  - model_name: qwen3.8
    litellm_params:
      model: ollama_chat/qwen3.8
      api_base: http://host.docker.internal:11434
    model_info:
      supports_function_calling: true
  # The same local model with a made-up price, only so the live budget test (apps/web/test/litellm-budgets-live.test.ts)
  # can spend a budget: Ollama costs 0, so a budget on it never runs out, and Landflow rounds a backstop budget up to a whole
  # cent, so one call here (about 15 tokens at $0.001 each) must cost more than that. Landflow does not use this name.
  - model_name: landflow-live-priced
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://host.docker.internal:11434
      input_cost_per_token: 0.001
      output_cost_per_token: 0.001
  # A hosted model reads its key from the environment (add ANTHROPIC_API_KEY to the service), never from this file:
  # - model_name: claude-sonnet-4-5
  #   litellm_params:
  #     model: anthropic/claude-sonnet-4-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
