# Override: the dev gateway with sign-in through Landflow-issued MCP tokens and Keycloak's access tokens (config.tokens-idp.yaml).
# Start the dev server (with LANDFLOW_OIDC_ISSUER set, see deploy/.env.example) and the auth profile first (the gateway fetches both
# key sets at startup):
#   COMPOSE_BAKE=false docker compose -p landflow-infra -f deploy/compose.infra.yml -f deploy/mcp-gateway/compose.tokens-idp.yml \
#     --profile auth --profile mcp-gateway up -d mcp-gateway
services:
  mcp-gateway:
    volumes:
      - ./mcp-gateway/config.tokens-idp.yaml:/config/config.yaml:ro
