# Override for the spike: the gateway in statefulMode: stateful (config.stateful.yaml), to see which notifications
# reach a client with a session.
#   COMPOSE_BAKE=false docker compose -p landflow-infra -f deploy/compose.infra.yml -f deploy/mcp-gateway/compose.stateful.yml \
#     --profile mcp-gateway up -d mcp-gateway
services:
  mcp-gateway:
    volumes:
      - ./mcp-gateway/config.stateful.yaml:/config/config.yaml:ro
