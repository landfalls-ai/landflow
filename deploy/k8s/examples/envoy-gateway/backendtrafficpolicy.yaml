# Envoy Gateway only: raise the idle timeouts for the Landflow HTTPRoute (components/gateway-httproute). Apply next to it:
#   kubectl --context <ctx> -n <ns> apply -f deploy/k8s/examples/envoy-gateway/backendtrafficpolicy.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: landflow
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: landflow }
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 1h
      maxStreamDuration: 0s
