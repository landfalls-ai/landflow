# The OrbStack overlay in queue mode: two mains, two workers, Postgres, Valkey and MinIO in landflow-dev.
#
#   docker --context orbstack buildx build --builder orbstack --load -f deploy/docker/host.Dockerfile -t landflow/host:k8s-dev .
#   kubectl --context orbstack apply -k deploy/k8s/overlays/orbstack-queue
#
# The same `landflow/host:k8s-dev` image runs the mains (`node server.js`) and the workers (`node worker.mjs`). Back to the plain
# overlay: apply ../orbstack, then delete what this added (Deployments landflow-worker, postgres (StatefulSet), valkey, minio;
# Services postgres, valkey, minio; ConfigMap minio-start; Secrets landflow-queue, landflow-minio, landflow-postgres;
# PodDisruptionBudgets landflow-worker, landflow-host; the postgres PVC): deploy/README.md "Queue mode on Kubernetes".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The components' objects take this namespace too (the one set in ../orbstack applies only to what that overlay lists).
namespace: landflow-dev
resources:
  - ../orbstack
components:
  - ../../components/postgres
  - ../../components/valkey
  - ../../components/minio
  - ../../components/queue-mode
images:
  - { name: landflow/host, newTag: k8s-dev }
patches:
  # Local images only, for the worker the component adds.
  - target: { kind: Deployment, name: landflow-worker }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # Where the Mac and the cluster reach the mains: the host Service, as in ../orbstack.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: landflow-worker }
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - { name: LANDFLOW_PUBLIC_URL, value: "http://landflow-host.landflow-dev.svc.cluster.local:3000" }
