# OrbStack's local cluster (kube context `orbstack`), namespace landflow-dev, with images built on this machine:
#
#   kubectl --context orbstack apply -k deploy/k8s/overlays/orbstack
#   kubectl --context orbstack apply -k deploy/k8s/overlays/orbstack -l 'app.kubernetes.io/component in (plugin,config)'   # plugins only
#
# OrbStack's cluster runs on the same Docker engine, so `landflow/*:k8s-dev` images are used as they are
# (imagePullPolicy: Never): nothing is pulled or pushed. Data stays on the landflow-data PersistentVolumeClaim (OrbStack's
# local-path storage) across rollouts: credentials, agents and the images Landflow's registry serves kagent survive a new
# image. `kubectl --context orbstack -n landflow-dev delete pvc landflow-data` (with the host scaled to 0) starts over.
# Dev-only secrets below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: landflow-dev
resources:
  - namespace.yaml
  - ../../base
# The package cache for the agents' sandboxes (Verdaccio, Athens, proxpi and an Alpine cache behind one Service,
# landflow-cache:8080; docs/a2a.md). Its images come from Docker Hub unless already local.
# Uncomment postgres and valkey for those in the namespace (also from Docker Hub):
components:
  - ../../components/package-cache
  # GitHub's MCP server for the agents' GitHub MCP tool (docs/a2a.md): no token in it, Landflow sends its credential.
  - ../../components/github-mcp
  # The Browser plugin (Chrome inside; build landflow/plugin-browser:k8s-dev first, see components/browser): off by default.
#   - ../../components/browser
  # Agent Shell and Web Search plugins (build landflow/plugin-<name>:k8s-dev first, see each component): off by default.
#   - ../../components/agent-shell
#   - ../../components/web-search
#   - ../../components/sap
#   - ../../components/postgres
#   - ../../components/valkey
images:
  - { name: landflow/host, newTag: k8s-dev }
  - { name: landflow/plugin-text-toolkit, newTag: k8s-dev }
  - { name: landflow/plugin-py-insights, newTag: k8s-dev }
  - { name: landflow/plugin-go-crypto, newTag: k8s-dev }
  - { name: landflow/plugin-messaging, newTag: k8s-dev }
  - { name: landflow/plugin-productivity, newTag: k8s-dev }
  - { name: landflow/plugin-google-workspace, newTag: k8s-dev }
  - { name: landflow/plugin-databases, newTag: k8s-dev }
  - { name: landflow/plugin-github, newTag: k8s-dev }
  - { name: landflow/plugin-browser, newTag: k8s-dev } # only used with components/browser
  - { name: landflow/plugin-agent-shell, newTag: k8s-dev } # only used with components/agent-shell
  - { name: landflow/plugin-web-search, newTag: k8s-dev } # only used with components/web-search
  - { name: landflow/plugin-sap, newTag: k8s-dev } # only used with components/sap
generatorOptions:
  disableNameSuffixHash: true
  labels: { app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: config }
secretGenerator:
  # The host and every plugin read it: plugins prove it to the host on GetManifest (docs/protocol.md §13).
  - name: landflow-registry
    literals: [secret=landflow-registry-dev-only]
  - name: landflow-host
    literals: [owner-email=owner@landflow.test, owner-password=landflow-dev-only, mcp-gateway-secret=landflow-mcp-gateway-dev-only-secret]
patches:
  # Local images only.
  - target: { kind: Deployment, labelSelector: app.kubernetes.io/part-of=landflow }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # The URL the Mac reaches the host on, and the Mac's Ollama.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: landflow-host }
      spec:
        template:
          spec:
            containers:
              - name: host
                env:
                  - { name: LANDFLOW_PUBLIC_URL, value: "http://landflow-host.landflow-dev.svc.cluster.local:3000" }
                  - { name: LANDFLOW_MCP_GATEWAY_PUBLIC_URL, value: "http://landflow-host.landflow-dev.svc.cluster.local:4000" }
                  # The Mac's Ollama, for Spotlight and the second brain.
                  - { name: OLLAMA_URL, value: "http://host.docker.internal:11434" }
