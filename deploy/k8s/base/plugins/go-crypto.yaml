# Crypto Toolkit (Go SDK). The Service's label makes the host discover it; the annotation names its gRPC port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-go-crypto
  labels: { app.kubernetes.io/name: plugin-go-crypto, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: plugin-go-crypto }
  template:
    metadata:
      labels: { app.kubernetes.io/name: plugin-go-crypto, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the image's `landflow` user
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: plugin
          image: landflow/plugin-go-crypto:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 7103 }
            - { name: grpc, containerPort: 7203 }
          env:
            # Discovered, so no announcing (set LANDFLOW_REGISTRY_URL to announce as well).
            - { name: LANDFLOW_REGISTRY_URL, value: "off" }
            - name: LANDFLOW_REGISTRY_SECRET # answers the host's challenge on GetManifest (docs/protocol.md §13)
              valueFrom: { secretKeyRef: { name: landflow-registry, key: secret, optional: true } }
          # Ready only while the plugin answers its health endpoint: the host follows readiness through EndpointSlices.
          readinessProbe:
            httpGet: { path: /landflow/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /landflow/v1/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-go-crypto
  labels: { app.kubernetes.io/name: plugin-go-crypto, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin, landflow.dev/plugin: "true" }
  annotations:
    landflow.dev/grpc-port: grpc
    # landflow.dev/http-port: http   # also register the HTTP binding
spec:
  selector: { app.kubernetes.io/name: plugin-go-crypto }
  ports:
    - { name: grpc, port: 7203, targetPort: grpc, appProtocol: grpc }
    - { name: http, port: 7103, targetPort: http }
