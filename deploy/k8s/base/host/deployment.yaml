# The Landflow host (UI, API, engine, plugin registry). One replica: the default store is SQLite in /data, so the
# Deployment recreates rather than rolls. Plugins are found through Kubernetes discovery (Services labelled
# landflow.dev/plugin=true in this namespace); announce, LANDFLOW_PLUGINS and scan keep working next to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landflow-host
  labels: { app.kubernetes.io/name: landflow-host, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: host }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: landflow-host }
  template:
    metadata:
      labels: { app.kubernetes.io/name: landflow-host, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: host }
    spec:
      serviceAccountName: landflow-host
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: host
          image: landflow/host:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
            - { name: registry, containerPort: 7070 }
          env:
            - { name: LANDFLOW_DATA_DIR, value: /data }
            - { name: LANDFLOW_PLUGIN_DISCOVERY, value: kubernetes }
            # Empty: the host's own namespace. A comma-separated list watches more (each needs the Role, see rbac.yaml).
            - { name: LANDFLOW_K8S_NAMESPACES, value: "" }
            # Nothing to scan on the pod's 127.0.0.1; plugins come from discovery.
            - { name: LANDFLOW_SCAN_ON_START, value: "false" }
            # Where plugins fetch and upload item files (/api/binary): this host's Service.
            - { name: LANDFLOW_INTERNAL_URL, value: "http://landflow-host:3000" }
            - { name: LANDFLOW_PUBLIC_URL, value: "http://localhost:3000" }
            - { name: LANDFLOW_LOG_LEVEL, value: info }
            - name: LANDFLOW_REGISTRY_SECRET # plugins prove it on GetManifest (docs/protocol.md §13); unset: not required
              valueFrom: { secretKeyRef: { name: landflow-registry, key: secret, optional: true } }
            - name: LANDFLOW_ENCRYPTION_KEY # unset: generated into /data/encryption.key on first use
              valueFrom: { secretKeyRef: { name: landflow-host, key: encryption-key, optional: true } }
            - name: LANDFLOW_OWNER_EMAIL # the first owner, created at boot while there is no user
              valueFrom: { secretKeyRef: { name: landflow-host, key: owner-email, optional: true } }
            - name: LANDFLOW_OWNER_PASSWORD
              valueFrom: { secretKeyRef: { name: landflow-host, key: owner-password, optional: true } }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: landflow-data }
