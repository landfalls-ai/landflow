# The Landflow host (UI, API, engine, plugin registry). One replica: the default store is SQLite in /data, so the
# Deployment recreates rather than rolls. Plugins are found through Kubernetes discovery (Services labelled
# landflow.dev/plugin=true in this namespace); announce, LANDFLOW_PLUGINS and scan keep working next to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landflow-host
  labels: { app.kubernetes.io/name: landflow-host, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: host }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: landflow-host }
  template:
    metadata:
      labels: { app.kubernetes.io/name: landflow-host, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: host }
    spec:
      serviceAccountName: landflow-host
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: host
          image: landflow/host:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
            - { name: registry, containerPort: 7070 }
          env:
            # The in-repo cluster runs development secrets; a real deployment sets production (docs/deployment.md).
            - { name: LANDFLOW_PROFILE, value: development }
            - { name: LANDFLOW_DATA_DIR, value: /data }
            - { name: LANDFLOW_PLUGIN_DISCOVERY, value: kubernetes }
            # Empty: the host's own namespace. A comma-separated list watches more (each needs the Role, see rbac.yaml).
            - { name: LANDFLOW_K8S_NAMESPACES, value: "" }
            # Nothing to scan on the pod's 127.0.0.1; plugins come from discovery.
            - { name: LANDFLOW_SCAN_ON_START, value: "false" }
            # Where plugins fetch and upload item files (/api/binary): this host's Service.
            - { name: LANDFLOW_INTERNAL_URL, value: "http://landflow-host:3000" }
            - { name: LANDFLOW_PUBLIC_URL, value: "http://localhost:3000" }
            - { name: LANDFLOW_LOG_LEVEL, value: info }
            # The MCP gateway sidecar (the second container): its admin API and this host share the pod's loopback.
            - { name: LANDFLOW_MCP_GATEWAY, value: bundled }
            - { name: LANDFLOW_MCP_GATEWAY_ADMIN_URL, value: "http://127.0.0.1:15000" }
            - { name: LANDFLOW_MCP_GATEWAY_HOST_URL, value: "http://127.0.0.1:3000" }
            - { name: LANDFLOW_MCP_GATEWAY_PUBLIC_URL, value: "http://localhost:4000" }
            - name: LANDFLOW_MCP_GATEWAY_SECRET # what the gateway sends as x-landflow-gateway; unset: the host refuses gateway calls
              valueFrom: { secretKeyRef: { name: landflow-host, key: mcp-gateway-secret, optional: true } }
            - name: LANDFLOW_REGISTRY_SECRET # plugins prove it on GetManifest (docs/protocol.md §13); unset: not required
              valueFrom: { secretKeyRef: { name: landflow-registry, key: secret, optional: true } }
            - name: LANDFLOW_ENCRYPTION_KEY # unset: generated into /data/encryption.key on first use
              valueFrom: { secretKeyRef: { name: landflow-host, key: encryption-key, optional: true } }
            - name: LANDFLOW_ENCRYPTION_KEYS # the key ring for rotation (kid:key, the new key first); unset: the key above only
              valueFrom: { secretKeyRef: { name: landflow-host, key: encryption-keys, optional: true } }
            - name: LANDFLOW_OWNER_EMAIL # the first owner, created at boot while there is no user
              valueFrom: { secretKeyRef: { name: landflow-host, key: owner-email, optional: true } }
            - name: LANDFLOW_OWNER_PASSWORD
              valueFrom: { secretKeyRef: { name: landflow-host, key: owner-password, optional: true } }
          # Next holds requests until boot (instrumentation) finishes, so no probe answers before then: the startup
          # probe gives boot up to 5 min (60 x 5 s) before liveness and readiness begin.
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3 # above the 1 s per-check limit, so a slow check is a 503 with its name
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
        # The bundled MCP gateway (agentgateway 1.6, docs/transports.md "Deployment"): /mcp on the `mcp` port, the admin
        # API on the pod's loopback only (the host writes its targets there), targets in SQLite on an emptyDir (rebuilt
        # from the plugin registry by the host's gateway sync on every start). Distroless, runs as 65532; same digest as compose.
        - name: mcp-gateway
          image: cr.agentgateway.dev/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
          imagePullPolicy: IfNotPresent
          args: ["-f", "/config/config.yaml"]
          ports:
            - { name: mcp, containerPort: 4000 }
          readinessProbe:
            httpGet: { path: /healthz/ready, port: 15021 }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: mcp-gateway-config, mountPath: /config, readOnly: true }
            - { name: mcp-gateway-data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: landflow-data }
        - name: mcp-gateway-config
          configMap: { name: landflow-mcp-gateway }
        - name: mcp-gateway-data
          emptyDir: { sizeLimit: 256Mi }
