# Landflow on Kubernetes: the host (with read-only RBAC for plugin discovery) and the seven example plugins.
# No namespace here: overlays set it (overlays/orbstack → landflow-dev). Optional pieces are components:
# ../components/postgres, ../components/valkey, ../components/external-services.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: { app.kubernetes.io/managed-by: kustomize }
resources:
  - host/rbac.yaml
  - host/pvc.yaml
  - host/deployment.yaml
  - host/service.yaml
  - plugins/text-toolkit.yaml
  - plugins/py-insights.yaml
  - plugins/go-crypto.yaml
  - plugins/messaging.yaml
  - plugins/productivity.yaml
  - plugins/google-workspace.yaml
  - plugins/databases.yaml
