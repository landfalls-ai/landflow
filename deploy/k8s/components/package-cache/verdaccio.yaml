apiVersion: v1
kind: ConfigMap
metadata:
  name: landflow-cache-verdaccio
  labels: { app.kubernetes.io/name: landflow-cache-npm, app.kubernetes.io/part-of: landflow-cache }
data:
  config.yaml: |
    storage: /verdaccio/storage/data
    auth:
      htpasswd:
        file: /verdaccio/storage/htpasswd
        max_users: -1
    uplinks:
      npmjs:
        url: https://registry.npmjs.org/
        cache: true
        timeout: 60s
        max_fails: 5
    packages:
      '**':
        access: $all
        publish: $authenticated
        unpublish: $authenticated
        proxy: npmjs
    # nginx serves this under /npm/; tarball URLs in the metadata are built from the request's Host and this prefix.
    url_prefix: /npm/
    server:
      keepAliveTimeout: 60
    log: { type: stdout, format: pretty, level: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landflow-cache-npm
  labels: { app.kubernetes.io/name: landflow-cache-npm, app.kubernetes.io/part-of: landflow-cache }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: landflow-cache-npm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: landflow-cache-npm, app.kubernetes.io/part-of: landflow-cache }
    spec:
      securityContext: { fsGroup: 10001 }
      containers:
        - name: verdaccio
          image: verdaccio/verdaccio:6.2.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 4873 }]
          readinessProbe:
            httpGet: { path: /-/ping, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /verdaccio/conf/config.yaml, subPath: config.yaml }
            - { name: storage, mountPath: /verdaccio/storage }
      volumes:
        - name: config
          configMap: { name: landflow-cache-verdaccio }
        - name: storage
          persistentVolumeClaim: { claimName: landflow-cache-npm }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: landflow-cache-npm
  labels: { app.kubernetes.io/name: landflow-cache-npm, app.kubernetes.io/part-of: landflow-cache }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: landflow-cache-npm
  labels: { app.kubernetes.io/name: landflow-cache-npm, app.kubernetes.io/part-of: landflow-cache }
spec:
  selector: { app.kubernetes.io/name: landflow-cache-npm }
  ports: [{ name: http, port: 4873, targetPort: http }]
