# Sign-in at the bundled MCP gateway with Landflow-issued MCP tokens and an identity provider's access tokens, on the same routes.
# Replaces the sidecar's ConfigMap with gateway-config.yaml (edit it for your URLs) and tells the host's gateway sync to check the
# same issuers on the per-plugin routes: the route policies name Landflow's tokens, LANDFLOW_OIDC_ISSUER names the provider, and
# the sync renders a `jwtAuth` with both (LANDFLOW_MCP_GATEWAY_ACCEPT_IDP=off keeps the routes to Landflow's tokens). Use it instead
# of gateway-landflow-tokens, not with it. See docs/mcp-gateway.md "Two issuers on one route".
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: landflow-mcp-gateway
    behavior: replace
    files:
      - config.yaml=gateway-config.yaml
patches:
  - target: { kind: Deployment, name: landflow-host }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: landflow-host }
      spec:
        template:
          spec:
            containers:
              - name: host
                env:
                  - name: LANDFLOW_MCP_GATEWAY_ROUTE_POLICIES
                    value: '{"mcpAuthentication":{"mode":"optional","issuer":"http://landflow.localhost","audiences":["http://landflow.localhost/mcp"],"jwks":{"url":"http://127.0.0.1:3000/api/mcp/jwks"}}}'
                  - name: LANDFLOW_OIDC_ISSUER
                    value: http://keycloak.landflow.localhost/realms/landflow
