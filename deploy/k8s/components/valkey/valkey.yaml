apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: { app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: landflow }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: valkey }
  template:
    metadata:
      labels: { app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: landflow }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          args: [--save, "", --appendonly, "no"]
          ports: [{ name: valkey, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [valkey-cli, ping] }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels: { app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: landflow }
spec:
  selector: { app.kubernetes.io/name: valkey }
  ports: [{ name: valkey, port: 6379, targetPort: valkey }]
