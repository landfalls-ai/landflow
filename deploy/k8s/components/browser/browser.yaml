# Browser (TypeScript SDK, Chrome and agent-browser, headless). The Service's label makes the host discover it; the
# annotation names its gRPC port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-browser
  labels: { app.kubernetes.io/name: plugin-browser, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: plugin-browser }
  template:
    metadata:
      labels: { app.kubernetes.io/name: plugin-browser, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: plugin
          image: landflow/plugin-browser:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 7112 }
            - { name: grpc, containerPort: 7212 }
          envFrom:
            - configMapRef: { name: landflow-transport, optional: true }
            - configMapRef: { name: landflow-transport-browser, optional: true }
            - secretRef: { name: landflow-transport, optional: true }
          env:
            - { name: LANDFLOW_REGISTRY_URL, value: "off" }
            - { name: LANDFLOW_MCP, value: "off" }
            - name: LANDFLOW_REGISTRY_SECRET # answers the host's challenge on GetManifest (docs/protocol.md §13)
              valueFrom: { secretKeyRef: { name: landflow-registry, key: secret, optional: true } }
            # The operator's ceiling on sites for every Browser node (comma separated, "*.example.com" includes subdomains).
            # Empty leaves each node to its own list, which defaults to its URL's site: set this for anything shared.
            - { name: LANDFLOW_BROWSER_ALLOWED_DOMAINS, value: "" }
          readinessProbe:
            httpGet: { path: /landflow/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /landflow/v1/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          # Each call starts a Chrome and the plugin runs two at once: Chrome needs memory and a roomy /dev/shm.
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-browser
  labels: { app.kubernetes.io/name: plugin-browser, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin, landflow.dev/plugin: "true" }
  annotations:
    landflow.dev/grpc-port: grpc
spec:
  selector: { app.kubernetes.io/name: plugin-browser }
  ports:
    - { name: grpc, port: 7212, targetPort: grpc, appProtocol: grpc }
    - { name: http, port: 7112, targetPort: http }
