# The Triage (TypeScript SDK, alert triage) plugin (plugins/triage): a component so the base stays as it is. Build it first:
#   docker --context orbstack buildx build --builder orbstack --load -f deploy/docker/node-plugin.Dockerfile \
#     --build-arg PLUGIN=triage --build-arg HTTP_PORT=7109 --build-arg GRPC_PORT=7209 -t landflow/plugin-triage:k8s-dev .
# Enable it with `- ../../components/triage` in an overlay's components (the orbstack overlay does).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - triage.yaml
