# Agent Shell (TypeScript SDK, just-bash: a simulated bash over an in-memory filesystem). The Service's label makes the host discover it; the
# annotation names its gRPC port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-agent-shell
  labels: { app.kubernetes.io/name: plugin-agent-shell, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: plugin-agent-shell }
  template:
    metadata:
      labels: { app.kubernetes.io/name: plugin-agent-shell, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: plugin
          image: landflow/plugin-agent-shell:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 7114 }
            - { name: grpc, containerPort: 7214 }
          envFrom:
            - configMapRef: { name: landflow-transport, optional: true }
            - configMapRef: { name: landflow-transport-agent-shell, optional: true }
            - secretRef: { name: landflow-transport, optional: true }
          env:
            - { name: LANDFLOW_REGISTRY_URL, value: "off" }
            - { name: LANDFLOW_MCP, value: "off" }
            - name: LANDFLOW_REGISTRY_SECRET # answers the host's challenge on GetManifest (docs/protocol.md §13)
              valueFrom: { secretKeyRef: { name: landflow-registry, key: secret, optional: true } }
          readinessProbe:
            httpGet: { path: /landflow/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /landflow/v1/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-agent-shell
  labels: { app.kubernetes.io/name: plugin-agent-shell, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin, landflow.dev/plugin: "true" }
  annotations:
    landflow.dev/grpc-port: grpc
spec:
  selector: { app.kubernetes.io/name: plugin-agent-shell }
  ports:
    - { name: grpc, port: 7214, targetPort: grpc, appProtocol: grpc }
    - { name: http, port: 7114, targetPort: http }
