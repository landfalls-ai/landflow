# A queue-mode worker: the host image started as `node worker.mjs`. It takes up to LANDFLOW_WORKER_CONCURRENCY runs at once from
# the Valkey stream, finds plugins through Kubernetes discovery like the mains (same ServiceAccount), and serves /healthz and
# /metrics on 5690 (the OTel metrics `landflow.queue.*`, `landflow.worker.active_jobs`: scraped by annotation, or sent with
# OTEL_EXPORTER_OTLP_ENDPOINT).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landflow-worker
  labels: { app.kubernetes.io/name: landflow-worker, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: landflow-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: landflow-worker, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5690"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: landflow-host
      # SIGTERM: no new jobs, LANDFLOW_WORKER_SHUTDOWN_SECONDS for the runs in flight, the rest back on the queue. Longer than that.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: landflow-worker }
      containers:
        - name: worker
          image: landflow/host:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "worker.mjs"]
          ports:
            - { name: health, containerPort: 5690 }
          env:
            - { name: LANDFLOW_ROLE, value: worker }
            - { name: LANDFLOW_EXECUTIONS_MODE, value: queue }
            - name: LANDFLOW_INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: LANDFLOW_WORKER_CONCURRENCY, value: "10" }
            - { name: LANDFLOW_WORKER_SHUTDOWN_SECONDS, value: "30" }
            - { name: LANDFLOW_WORKER_PORT, value: "5690" }
            - { name: LANDFLOW_DATA_DIR, value: /data }
            - { name: LANDFLOW_LOG_LEVEL, value: info }
            - { name: LANDFLOW_SCAN_ON_START, value: "false" }
            - { name: LANDFLOW_PLUGIN_DISCOVERY, value: kubernetes }
            - { name: LANDFLOW_K8S_NAMESPACES, value: "" }
            # A plugin given a file link by a worker fetches it from a main: the host Service.
            - { name: LANDFLOW_INTERNAL_URL, value: "http://landflow-host:3000" }
            - { name: LANDFLOW_PUBLIC_URL, value: "http://localhost:3000" }
            - { name: LANDFLOW_DB, value: postgres }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: landflow-postgres, key: database-url } }
            - { name: LANDFLOW_VALKEY_URL, value: "redis://valkey:6379/0" }
            - { name: LANDFLOW_BINARY_STORE, value: s3 }
            - { name: LANDFLOW_S3_ENDPOINT, value: "http://minio:9000" }
            - { name: LANDFLOW_S3_BUCKET, value: landflow }
            - { name: LANDFLOW_S3_PREFIX, value: "queue/" }
            - { name: LANDFLOW_S3_REGION, value: us-east-1 }
            - { name: LANDFLOW_S3_FORCE_PATH_STYLE, value: "true" }
            - name: LANDFLOW_S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: landflow-minio, key: access-key-id } }
            - name: LANDFLOW_S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: landflow-minio, key: secret-access-key } }
            - name: LANDFLOW_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: landflow-queue, key: encryption-key } }
            - name: LANDFLOW_BINARY_SECRET
              valueFrom: { secretKeyRef: { name: landflow-queue, key: binary-secret } }
            - name: LANDFLOW_REGISTRY_SECRET
              valueFrom: { secretKeyRef: { name: landflow-registry, key: secret, optional: true } }
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 1Gi }
