# Optional: discover plugin Services in every namespace (LANDFLOW_K8S_NAMESPACES=*) with one cluster-wide list/watch per
# kind, instead of a Role in each namespace. Adds a ClusterRole and a ClusterRoleBinding (both landflow-plugin-
# discovery-cluster, read-only Services and EndpointSlices) for the host's ServiceAccount. Two installs in one cluster
# need different names (a nameSuffix in their overlays). Example: ../../overlays/orbstack-cluster-wide.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - rbac.yaml
patches:
  - target: { kind: Deployment, name: landflow-host }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: landflow-host }
      spec:
        template:
          spec:
            containers:
              - name: host
                env:
                  - { name: LANDFLOW_K8S_NAMESPACES, value: "*" }
