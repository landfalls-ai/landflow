# Landledger (TypeScript SDK): the land family's cost subledger (plugins/landledger). Its credential defaults to
# http://landledger-api.landflow-dev.svc.cluster.local:4810, the ExternalName Service below. The Service's label makes the
# host discover it; the annotation names its gRPC port. Built on this machine (imagePullPolicy: Never).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-landledger
  labels: { app.kubernetes.io/name: plugin-landledger, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: plugin-landledger }
  template:
    metadata:
      labels: { app.kubernetes.io/name: plugin-landledger, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: plugin
          image: landflow/plugin-landledger:k8s-dev
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 7120 }
            - { name: grpc, containerPort: 7220 }
          # Brokers: none by default. components/broker-transports creates these (LANDFLOW_TRANSPORTS, LANDFLOW_<KIND>_URL,
          # LANDFLOW_TRANSPORT_SECRET, LANDFLOW_MAX_CONCURRENCY); env below wins over them.
          envFrom:
            - configMapRef: { name: landflow-transport, optional: true }
            - configMapRef: { name: landflow-transport-landledger, optional: true }
            - secretRef: { name: landflow-transport, optional: true }
          env:
            # Discovered, so no announcing (set LANDFLOW_REGISTRY_URL to announce as well).
            - { name: LANDFLOW_REGISTRY_URL, value: "off" }
            # The plugin's own MCP face is off here: agents reach plugins through the host's per-plugin endpoints and the gateway.
            # To turn it on set value "on" and add LANDFLOW_MCP_TOKEN from a Secret (the pod listens on 0.0.0.0, so a token is required):
            #   - name: LANDFLOW_MCP_TOKEN
            #     valueFrom: { secretKeyRef: { name: landflow-plugin-mcp, key: token } }
            - { name: LANDFLOW_MCP, value: "off" }
            - name: LANDFLOW_REGISTRY_SECRET # answers the host's challenge on GetManifest (docs/protocol.md §13)
              valueFrom: { secretKeyRef: { name: landflow-registry, key: secret, optional: true } }
          # Ready only while the plugin answers its health endpoint: the host follows readiness through EndpointSlices.
          readinessProbe:
            httpGet: { path: /landflow/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /landflow/v1/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 160Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-landledger
  labels: { app.kubernetes.io/name: plugin-landledger, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: plugin, landflow.dev/plugin: "true" }
  annotations:
    landflow.dev/grpc-port: grpc
    # landflow.dev/http-port: http   # also register the HTTP binding
spec:
  selector: { app.kubernetes.io/name: plugin-landledger }
  ports:
    - { name: grpc, port: 7220, targetPort: grpc, appProtocol: grpc }
    - { name: http, port: 7120, targetPort: http }
---
# Landledger's API as the cluster sees it. Landledger runs on the Mac (127.0.0.1:4810, its own compose project), so this
# name points at the Mac through OrbStack's host.orb.internal. When Landledger runs in the cluster, replace it with a
# Service (or an ExternalName to landledger-api.<its namespace>.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: landledger-api
  labels: { app.kubernetes.io/name: landledger-api, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: external }
spec:
  type: ExternalName
  externalName: host.orb.internal
  ports:
    - { name: http, port: 4810 }
