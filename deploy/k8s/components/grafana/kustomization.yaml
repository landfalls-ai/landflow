# The Grafana (TypeScript SDK) plugin (plugins/grafana): a component so the base stays as it is. Build it first:
#   docker --context orbstack buildx build --builder orbstack --load -f deploy/docker/node-plugin.Dockerfile \
#     --build-arg PLUGIN=grafana --build-arg HTTP_PORT=7121 --build-arg GRPC_PORT=7221 -t landflow/plugin-grafana:k8s-dev .
# Enable it with `- ../../components/grafana` in an overlay's components (the orbstack overlay does).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - grafana.yaml
