# Publishes the host, its MCP gateway and the Mailpit UI on this Mac's localhost. OrbStack gives every LoadBalancer Service
# a port on localhost (no ingress controller needed):
#   Landflow        http://localhost:53000
#   MCP gateway     http://localhost:54000/mcp
#   Mailpit (mail)  http://localhost:58025
# These are the compose stack's ports (deploy/.env.example), so stop that stack first if both run.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - local-access.yaml
