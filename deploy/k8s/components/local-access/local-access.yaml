apiVersion: v1
kind: Service
metadata:
  name: landflow-host-local
  labels: { app.kubernetes.io/name: landflow-host-local, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: local-access }
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: landflow-host }
  ports:
    - { name: http, port: 53000, targetPort: 3000 }
    - { name: mcp, port: 54000, targetPort: 4000 }
---
apiVersion: v1
kind: Service
metadata:
  name: landflow-mailpit-local
  labels: { app.kubernetes.io/name: landflow-mailpit-local, app.kubernetes.io/part-of: landflow, app.kubernetes.io/component: local-access }
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: landflow-mailpit }
  ports:
    - { name: http, port: 58025, targetPort: 8025 }
