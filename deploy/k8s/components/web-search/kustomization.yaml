# The Web Search plugin (plugins/web-search): a normal Node plugin on deploy/docker/node-plugin.Dockerfile, a component so the
# base stays as it is. Build it first:
#   docker --context orbstack buildx build --builder orbstack --load -f deploy/docker/node-plugin.Dockerfile \
#     --build-arg PLUGIN=web-search --build-arg HTTP_PORT=7113 --build-arg GRPC_PORT=7213 -t landflow/plugin-web-search:k8s-dev .
# Enable it with `- ../../components/web-search` in an overlay's components (the orbstack overlay has it commented out).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - web-search.yaml
