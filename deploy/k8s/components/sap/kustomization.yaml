# The SAP plugin (plugins/sap): a normal Node plugin on deploy/docker/node-plugin.Dockerfile, a component so the
# base stays as it is. Build it first:
#   docker --context orbstack buildx build --builder orbstack --load -f deploy/docker/node-plugin.Dockerfile \
#     --build-arg PLUGIN=sap --build-arg HTTP_PORT=7116 --build-arg GRPC_PORT=7216 -t landflow/plugin-sap:k8s-dev .
# Enable it with `- ../../components/sap` in an overlay's components (the orbstack overlay has it commented out).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - sap.yaml
