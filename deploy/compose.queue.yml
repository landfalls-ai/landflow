# Queue mode with high availability (docs/features/engine.md "Queue mode, workers and high availability"): two mains behind a small
# load balancer, two workers and the text-toolkit plugin, on the infra stack's Postgres, Valkey and MinIO.
#
#   docker compose -f deploy/compose.infra.yml up -d                    # Postgres, Valkey, MinIO + the landflow-infra network
#   docker compose -f deploy/compose.infra.yml exec postgres createdb -U landflow landflow_queue   # once
#   COMPOSE_BAKE=false docker compose -f deploy/compose.queue.yml up -d --build --wait            # http://localhost:53080
#
# - lb (53080): round robin over the mains, skipping one that is down; a browser sticks to one main (deploy/queue/lb.mjs).
# - main-1 (53081), main-2 (53082): UI, API, webhooks. They enqueue production runs on Valkey and elect a leader that
#   runs the schedules, polls, IMAP IDLE, timers and retention; the other takes over within about 13 s.
# - worker-1, worker-2 (health and metrics on 55691, 55692): `node worker.mjs`, 10 runs at once each by default.
# - All of them share the Postgres database `landflow_queue` (with the credentials and settings files: queue mode keeps
#   them in the database), the Valkey key prefix, the data volume, the encryption key, the file-link secret and the
#   binary store (MinIO bucket `landflow`, prefix `queue/`).
# - Broker connections: saved once in the database through a main (Settings → Transports, POST /api/transports/connections),
#   opened by every main and worker, followed live when changed. Plugins announced only over a broker (no HTTP/gRPC
#   endpoint) run in workers too. Use LANDFLOW_QUEUE_TRANSPORT_SECRET for a secret of your own.
# - Marketplace node plugins run in every main and worker (each its own copy, on 127.0.0.1). Local marketplaces need
#   LANDFLOW_QUEUE_MARKETPLACE_ALLOW_LOCAL=1.
#
# Development values throughout (dev passwords, a fixed encryption key): don't expose these ports. Details:
# docs/deployment.md "Queue mode (two mains, two workers)".

name: landflow-queue

x-host-env: &host-env
  # These stacks run the development secrets from deploy/.env.example; a real deployment sets production (docs/deployment.md).
  LANDFLOW_PROFILE: development
  LANDFLOW_EXECUTIONS_MODE: queue
  LANDFLOW_DB: postgres
  DATABASE_URL: postgres://landflow:landflow-dev-only@postgres:5432/${LANDFLOW_QUEUE_DATABASE:-landflow_queue}
  LANDFLOW_VALKEY_URL: redis://valkey:6379
  # Valkey Sentinel instead (deploy/compose.sentinel.yml): LANDFLOW_QUEUE_VALKEY_SENTINELS=valkey-sentinel-1:26379,…
  LANDFLOW_VALKEY_SENTINELS: ${LANDFLOW_QUEUE_VALKEY_SENTINELS:-}
  # Valkey Cluster instead (compose.infra.yml, profile valkey-cluster): LANDFLOW_QUEUE_VALKEY_CLUSTER=valkey-cluster-1:6379,…
  LANDFLOW_VALKEY_CLUSTER: ${LANDFLOW_QUEUE_VALKEY_CLUSTER:-}
  LANDFLOW_VALKEY_MASTER_NAME: ${LANDFLOW_QUEUE_VALKEY_MASTER_NAME:-mymaster}
  LANDFLOW_QUEUE_PREFIX: ${LANDFLOW_QUEUE_PREFIX:-landflow-queue}
  LANDFLOW_LEADER_TTL_SECONDS: ${LANDFLOW_LEADER_TTL_SECONDS:-10}
  LANDFLOW_STALLED_SECONDS: ${LANDFLOW_STALLED_SECONDS:-30}
  LANDFLOW_DATA_DIR: /data
  # Every main and worker decrypts the same credentials and signs file links the same way.
  LANDFLOW_ENCRYPTION_KEY: ${LANDFLOW_QUEUE_ENCRYPTION_KEY:-landflow-queue-dev-only-encryption-key}
  LANDFLOW_BINARY_SECRET: ${LANDFLOW_QUEUE_BINARY_SECRET:-landflow-queue-dev-only-binary-secret}
  # Item files in the infra stack's MinIO (explicit endpoint and keys: never the AWS default credential chain).
  LANDFLOW_BINARY_STORE: s3
  LANDFLOW_S3_ENDPOINT: http://minio:9000
  LANDFLOW_S3_BUCKET: landflow
  LANDFLOW_S3_PREFIX: queue/
  LANDFLOW_S3_REGION: us-east-1
  LANDFLOW_S3_ACCESS_KEY_ID: landflow
  LANDFLOW_S3_SECRET_ACCESS_KEY: landflow-dev-only
  LANDFLOW_S3_FORCE_PATH_STYLE: "true"
  # Links the host hands out (resume URLs) and where plugins fetch item files: through the load balancer.
  LANDFLOW_PUBLIC_URL: http://localhost:${LANDFLOW_QUEUE_PORT:-53080}
  LANDFLOW_INTERNAL_URL: http://lb:3000
  LANDFLOW_SCAN_ON_START: "false"
  LANDFLOW_MARKETPLACE_ALLOW_LOCAL: ${LANDFLOW_QUEUE_MARKETPLACE_ALLOW_LOCAL:-}
  LANDFLOW_LOG_LEVEL: ${LANDFLOW_LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${LANDFLOW_QUEUE_OTLP_ENDPOINT:-}
  LANDFLOW_TRACE_URL: ${LANDFLOW_TRACE_URL:-http://localhost:56686/trace/{traceId}}
  # The MCP gateway: one agentgateway sidecar per main (below), each kept in step by its main through the shared loopback;
  # agents reach /mcp through the load balancer, which sends it to port 4000 of a main (deploy/queue/lb.mjs).
  LANDFLOW_MCP_GATEWAY: ${LANDFLOW_MCP_GATEWAY:-bundled}
  LANDFLOW_MCP_GATEWAY_ADMIN_URL: http://127.0.0.1:15000
  LANDFLOW_MCP_GATEWAY_HOST_URL: http://127.0.0.1:3000
  LANDFLOW_MCP_GATEWAY_PUBLIC_URL: ${LANDFLOW_MCP_GATEWAY_PUBLIC_URL:-http://localhost:${LANDFLOW_QUEUE_PORT:-53080}}
  LANDFLOW_MCP_GATEWAY_SECRET: ${LANDFLOW_MCP_GATEWAY_SECRET:-landflow-mcp-gateway-dev-only-secret}
  # Message brokers (docs/transports.md "Queue mode"): every main AND worker opens the instance's enabled broker connections
  # (saved in the shared database, Settings → Transports) and discovers plugins over them. Without this secret no broker
  # connection opens; plugins that serve on a broker need the same value. Brokers on the infra stack are reachable at
  # nats:4222, kafka:9092, rabbitmq:5672, valkey:6379 … (both networks are attached).
  LANDFLOW_TRANSPORT_SECRET: ${LANDFLOW_QUEUE_TRANSPORT_SECRET:-landflow-queue-dev-only-transport-secret}
  # Claim check (protocol §14.6): bodies too big for a broker go by reference through this stack's MinIO. Plugins that serve
  # on a broker need the same three values.
  LANDFLOW_CLAIM_STORE: "${LANDFLOW_QUEUE_CLAIM_STORE:-s3://landflow/queue-claims?endpoint=http://minio:9000&region=us-east-1&forcePathStyle=true}"
  LANDFLOW_CLAIM_ACCESS_KEY_ID: landflow
  LANDFLOW_CLAIM_SECRET_ACCESS_KEY: landflow-dev-only

x-mcp-gateway: &mcp-gateway
  # agentgateway 1.6 as a main's sidecar (docs/transports.md "Deployment"): the same digest as compose.infra.yml, the
  # sidecar base config (admin API on the shared 127.0.0.1:15000, targets in SQLite under /data, rebuilt by the main's sync).
  image: cr.agentgateway.dev/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
  restart: unless-stopped
  command: ["-f", "/config/config.yaml"]

x-host: &host
  image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/host:${LANDFLOW_IMAGE_TAG:-dev}
  restart: unless-stopped
  init: true
  volumes:
    - landflow-queue-data:/data
  networks: [landflow-queue, landflow-infra]
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-worker-health: &worker-health
  test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5690/healthz || exit 1"]
  interval: 5s
  timeout: 3s
  start_period: 20s
  retries: 6

services:
  main-1:
    <<: *host
    # Longer than LANDFLOW_SHUTDOWN_SECONDS (25): Docker's default 10 s would kill the main before it flushes.
    stop_grace_period: 30s
    build:
      context: ..
      dockerfile: deploy/docker/host.Dockerfile
    ports:
      - "127.0.0.1:${LANDFLOW_QUEUE_MAIN1_PORT:-53081}:3000"
    environment:
      <<: *host-env
      LANDFLOW_INSTANCE_ID: main-1
      OTEL_SERVICE_NAME: landflow-main
      # The first main creates the owner (development values); the others start once it is up.
      LANDFLOW_OWNER_EMAIL: ${LANDFLOW_OWNER_EMAIL-owner@landflow.test}
      LANDFLOW_OWNER_PASSWORD: ${LANDFLOW_OWNER_PASSWORD-landflow-dev-only}

  main-2:
    <<: *host
    # Longer than LANDFLOW_SHUTDOWN_SECONDS (25): Docker's default 10 s would kill the main before it flushes.
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${LANDFLOW_QUEUE_MAIN2_PORT:-53082}:3000"
    environment:
      <<: *host-env
      LANDFLOW_INSTANCE_ID: main-2
      OTEL_SERVICE_NAME: landflow-main
    depends_on:
      main-1:
        condition: service_healthy

  mcp-gateway-1:
    <<: *mcp-gateway
    network_mode: service:main-1
    volumes:
      - ./mcp-gateway/config.sidecar.yaml:/config/config.yaml:ro
      - landflow-queue-mcp-gateway-1:/data
    depends_on:
      main-1:
        condition: service_started
      mcp-gateway-init:
        condition: service_completed_successfully

  mcp-gateway-2:
    <<: *mcp-gateway
    network_mode: service:main-2
    volumes:
      - ./mcp-gateway/config.sidecar.yaml:/config/config.yaml:ro
      - landflow-queue-mcp-gateway-2:/data
    depends_on:
      main-2:
        condition: service_started
      mcp-gateway-init:
        condition: service_completed_successfully

  mcp-gateway-init:
    # Gives both data volumes to the gateway's user (65532); the image has no shell to do it itself.
    image: alpine:3.22
    command: ["chown", "65532:65532", "/data-1", "/data-2"]
    volumes:
      - landflow-queue-mcp-gateway-1:/data-1
      - landflow-queue-mcp-gateway-2:/data-2

  worker-1:
    <<: *host
    command: ["node", "worker.mjs"]
    ports:
      - "127.0.0.1:${LANDFLOW_QUEUE_WORKER1_PORT:-55691}:5690"
    environment:
      <<: *host-env
      LANDFLOW_INSTANCE_ID: worker-1
      LANDFLOW_WORKER_CONCURRENCY: ${LANDFLOW_WORKER_CONCURRENCY:-10}
      OTEL_SERVICE_NAME: landflow-worker
    healthcheck: *worker-health
    # Past the worker's own deadline (LANDFLOW_WORKER_SHUTDOWN_SECONDS + 10 s = 40 s), so SIGKILL never lands mid-close.
    stop_grace_period: 45s
    depends_on:
      main-1:
        condition: service_healthy

  worker-2:
    <<: *host
    command: ["node", "worker.mjs"]
    ports:
      - "127.0.0.1:${LANDFLOW_QUEUE_WORKER2_PORT:-55692}:5690"
    environment:
      <<: *host-env
      LANDFLOW_INSTANCE_ID: worker-2
      LANDFLOW_WORKER_CONCURRENCY: ${LANDFLOW_WORKER_CONCURRENCY:-10}
      OTEL_SERVICE_NAME: landflow-worker
    healthcheck: *worker-health
    # Past the worker's own deadline (LANDFLOW_WORKER_SHUTDOWN_SECONDS + 10 s = 40 s), so SIGKILL never lands mid-close.
    stop_grace_period: 45s
    depends_on:
      main-1:
        condition: service_healthy

  lb:
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/host:${LANDFLOW_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    command: ["node", "/lb/lb.mjs"]
    working_dir: /lb
    environment:
      LB_UPSTREAMS: main-1:3000,main-2:3000
      LB_PORT: "3000"
      # /mcp (and the protected resource metadata agents fetch before signing in) go to the main's gateway sidecar.
      LB_MCP_PORT: "4000"
      LB_MCP_PATHS: /mcp,/.well-known/oauth-protected-resource
    volumes:
      - ./queue/lb.mjs:/lb/lb.mjs:ro
    ports:
      - "127.0.0.1:${LANDFLOW_QUEUE_PORT:-53080}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/lb/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
    networks: [landflow-queue]

  # A plugin registered through the load balancer: the mains keep its address in Postgres, and the workers connect to
  # it directly.
  text-toolkit:
    image: ${LANDFLOW_IMAGE_PREFIX:-landflow}/plugin-text-toolkit:${LANDFLOW_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/docker/node-plugin.Dockerfile
      args: { PLUGIN: text-toolkit, HTTP_PORT: "7101", GRPC_PORT: "7201" }
    restart: unless-stopped
    init: true
    environment:
      LANDFLOW_REGISTRY_URL: http://lb:3000
      LANDFLOW_ADVERTISE_HOST: text-toolkit
      LANDFLOW_LOG_LEVEL: ${LANDFLOW_LOG_LEVEL:-info}
      # Same secret as the mains and workers (needed once the plugin serves on a broker: LANDFLOW_TRANSPORTS=http,grpc,nats
      # with LANDFLOW_NATS_URL=nats://nats:4222, and so on). The plugin's own MCP face is off in containers (agents use the gateway).
      LANDFLOW_TRANSPORTS: ${LANDFLOW_PLUGIN_TRANSPORTS:-http,grpc}
      LANDFLOW_TRANSPORT_SECRET: ${LANDFLOW_QUEUE_TRANSPORT_SECRET:-landflow-queue-dev-only-transport-secret}
      LANDFLOW_CLAIM_STORE: "${LANDFLOW_QUEUE_CLAIM_STORE:-s3://landflow/queue-claims?endpoint=http://minio:9000&region=us-east-1&forcePathStyle=true}"
      LANDFLOW_CLAIM_ACCESS_KEY_ID: landflow
      LANDFLOW_CLAIM_SECRET_ACCESS_KEY: landflow-dev-only
      LANDFLOW_MCP: ${LANDFLOW_PLUGIN_MCP:-off}
      LANDFLOW_MCP_TOKEN: ${LANDFLOW_PLUGIN_MCP_TOKEN:-}
    networks: [landflow-queue]
    depends_on:
      lb:
        condition: service_started

volumes:
  landflow-queue-data:
  landflow-queue-mcp-gateway-1:
  landflow-queue-mcp-gateway-2:

networks:
  landflow-queue:
  landflow-infra:
    external: true
