# Mosquitto 2 for Landflow's MQTT 5 transport tests. Development only: anonymous clients are allowed; the
# compose file publishes the listener on 127.0.0.1 (LANDFLOW_BIND_ADDR), so only this machine reaches it.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# Shared subscriptions ($share/<group>/<topic>), message expiry, response topics and correlation data are MQTT 5
# features and need no configuration. Keep retained messages and persistent sessions across restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

max_inflight_messages 64
max_queued_messages 10000
message_size_limit 0
log_dest stdout
log_type error
log_type warning
log_type notice

# TCP_NODELAY on client sockets. Without it Nagle's algorithm meets the clients' delayed ACKs and every small publish the
# broker sends waits ~40 ms (a 100-byte request/reply measured 42 ms; 256 KiB took 0.8 ms). Mosquitto 2.0.19+ and 2.1.
set_tcp_nodelay true
