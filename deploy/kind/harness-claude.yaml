# The Claude Code Harness in the landflow-kagent kind cluster (docs/a2a.md, "On Claude Code"): kagent's Claude runtime (the
# release's claude-harness image, Claude Code with its own tools in the sandbox) on the same gVisor WorkerPool and snapshot
# store as landflow-kagent. An agent runs here when its kagent card's Runtime is "Claude Code · landflow-claude"; Landflow
# then writes its model as Anthropic's API (Ollama serves it) and its Claude Code plugins, pinned to a commit.
#
# Claude Code asks for its model aliases (haiku for small background calls, sonnet or opus for a plugin's subagents) by
# name; Ollama has none of them, so they all point at the local model the example agents use.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: landflow-claude
  namespace: kagent
spec:
  claude: {}
  env:
    - { name: ANTHROPIC_DEFAULT_HAIKU_MODEL, value: "qwen3-coder:30b" }
    - { name: ANTHROPIC_DEFAULT_SONNET_MODEL, value: "qwen3-coder:30b" }
    - { name: ANTHROPIC_DEFAULT_OPUS_MODEL, value: "qwen3-coder:30b" }
    - { name: CLAUDE_CODE_SUBAGENT_MODEL, value: "qwen3-coder:30b" }
    - { name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, value: "1" }
  substrate:
    workerPoolRef: { name: kagent-default }
    snapshotPolicy: { location: s3://ate-snapshots/kagent/ }
