# The Harness Landflow's agents run on in the landflow-kagent kind cluster (docs/a2a.md, "Landflow agents on kagent"): kagent's
# built-in runtime (the release's image) on the install's gVisor WorkerPool, snapshots in the bundled store. The agents
# themselves (AgentTemplate, Agent, ModelConfig, RemoteMCPServer, Secret) are written by Landflow when an agent is deployed
# from its builder, with the persona built there: none are written by hand.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: landflow-kagent
  namespace: kagent
spec:
  kagent: {}
  substrate:
    workerPoolRef: { name: kagent-default }
    snapshotPolicy: { location: s3://ate-snapshots/kagent/ }
