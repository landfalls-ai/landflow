# What Landflow's agents on kagent may reach beyond Landflow and their model (docs/a2a.md, "Network for Claude Code"):
# kagent's sandboxes have no egress, so a Claude Code agent couldn't install a toolchain or a project's dependencies.
# This grants the package cache, for every workload in the kagent namespace, and nothing else: no registry is reachable
# directly. The cache (landflow-cache in landflow-dev, deploy/k8s/components/package-cache) fetches from npm, the Go module
# proxy and checksum database, PyPI and Alpine for them, and keeps what it fetched; deploy/kind/bridge.yaml is the way to it
# from kind. kagent's egress gateway (ate-system/atenet-egress) enforces it by origin.
#
#   kubectl --kubeconfig "$KIND_KUBECONFIG" apply -f deploy/kind/egress-dev.yaml    # kagent-up.sh applies it
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: landflow-dev-packages
  namespace: kagent
spec:
  destinations:
    # /npm/ (npm, pnpm, yarn, corepack), /go/ (modules and the checksum database), /pypi/ (pip, uv), /apk/ (apk add).
    - origin: http://landflow-cache.landflow.svc.cluster.local:8080
