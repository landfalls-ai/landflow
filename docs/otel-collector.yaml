# OpenTelemetry Collector config for local Landflow development (see docs/observability.md §7).
#
#   docker run --rm -p 4317:4317 -p 4318:4318 -p 9464:9464 \
#     -v "$PWD/docs/otel-collector.yaml:/etc/otelcol-contrib/config.yaml" \
#     -v "$PWD/.otel:/var/otel" \
#     otel/opentelemetry-collector-contrib:0.162.0
#
# Then run the host and the plugins with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
# The Collector receives OTLP over HTTP (protobuf or JSON, so the host and the TypeScript SDK work
# as they are) and gRPC. It prints a summary of each batch, appends everything to JSON-lines files
# under .otel/, and serves all metrics in one place for Prometheus at http://localhost:9464/metrics.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # One line per batch; set `verbosity: detailed` to print every span and data point.
  debug:
    verbosity: basic
  file/traces:
    path: /var/otel/traces.jsonl
  file/metrics:
    path: /var/otel/metrics.jsonl
  file/logs:
    path: /var/otel/logs.jsonl
  prometheus:
    endpoint: 0.0.0.0:9464
    # Same names as the host's /api/metrics and the plugins' /metrics
    # (landflow_execution_duration_milliseconds, landflow_executions_total, …).
    add_metric_suffixes: true
    resource_to_telemetry_conversion:
      enabled: true

  # To also browse traces, add Jaeger (all-in-one accepts OTLP on its own 4317/4318; map it to
  # other host ports, e.g. -p 14317:4317) and uncomment:
  # otlp/jaeger:
  #   endpoint: host.docker.internal:14317
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/traces] # , otlp/jaeger
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/metrics, prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/logs]
