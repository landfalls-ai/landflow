// Landflow plugin protocol — v1
//
// A plugin is a process that hosts one or more node types. The Landflow host
// discovers plugins, pulls their manifest, renders the node UI from the
// descriptors and calls Execute when a workflow reaches one of their nodes.
//
// The same contract is exposed over HTTP+JSON (see docs/protocol.md). Anything
// recursive or open-ended (node descriptors, parameters, item payloads) travels
// as a JSON-encoded DynamicValue so both transports share one JSON Schema
// (packages/protocol/schema/*.json). This mirrors Terraform's tfplugin
// DynamicValue approach: a typed envelope, a dynamic payload.
syntax = "proto3";

package landflow.plugin.v1;

option go_package = "github.com/landflow/landflow/sdks/go/landflowpb;landflowpb";

// Implemented by every plugin.
service PluginService {
  // Describe the plugin and every node type it provides.
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);
  // Run one node over a batch of input items.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  // Resolve a dynamic dropdown (property.typeOptions.loadOptionsMethod).
  rpc LoadOptions(LoadOptionsRequest) returns (LoadOptionsResponse);
  // Liveness probe used by discovery and the registry heartbeat.
  rpc Health(HealthRequest) returns (HealthResponse);
  // Check credential values against the service ("Test connection").
  rpc TestCredentials(TestCredentialsRequest) returns (TestCredentialsResponse);
  // App webhook triggers (triggerSource "appWebhook"): check, register or remove
  // the node's webhook at its service (docs/protocol.md §12).
  rpc WebhookMethod(WebhookMethodRequest) returns (WebhookMethodResponse);
  // App webhook triggers: turn a call the service made to the node's webhook URL
  // into items for a run, and the answer the service gets.
  rpc ReceiveWebhook(ReceiveWebhookRequest) returns (ReceiveWebhookResponse);
}

// Trace context: the host sends W3C traceparent / tracestate / baggage as gRPC
// metadata (HTTP headers on the HTTP binding) with every call, so plugin spans
// join the workflow's trace. See docs/observability.md.

// Implemented by the Landflow host (default :7070). Plugins announce
// themselves here; the HTTP equivalent is POST /api/plugins/announce.
service RegistryService {
  rpc Announce(AnnounceRequest) returns (AnnounceResponse);
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
}

// JSON-encoded value. `json` holds UTF-8 JSON bytes.
message DynamicValue {
  bytes json = 1;
}

message PluginInfo {
  string id = 1;          // stable, url-safe: "go-crypto"
  string name = 2;        // display name: "Crypto Toolkit"
  string version = 3;     // semver of the plugin
  string description = 4;
  string language = 5;    // "typescript" | "python" | "go" | ...
  string sdk_name = 6;    // "landflow-sdk-go"
  string sdk_version = 7;
  string icon = 8;        // "lucide:hash" | "emoji:🔐" | https/data URL (SDKs inline file: icons)
  string author = 9;
  string homepage = 10;
  string color = 11;      // brand colour (hex): "#0d9488"
}

// ---- Manifest ---------------------------------------------------------

message GetManifestRequest {
  string host_version = 1;
}

message GetManifestResponse {
  string protocol = 1;             // "landflow.plugin/v1"
  PluginInfo plugin = 2;
  repeated DynamicValue nodes = 3; // each: a NodeDescriptor JSON object
  repeated DynamicValue credential_types = 4; // each: a CredentialTypeDescriptor JSON object
  // Transport hints (docs/protocol.md §14.1; additive, empty/0 when the plugin predates them):
  repeated string transports = 5;  // faces this process was built with: "http", "grpc", "mcp", "kafka", ...
  int32 max_concurrency = 6;       // calls one instance takes at once; 0 = unknown (the host assumes 16)
  repeated DynamicValue composites = 7; // each: a CompositeTypeDescriptor JSON object (docs/composites.md)
}

// ---- Execute ----------------------------------------------------------

message NodeRef {
  string id = 1;
  string name = 2;         // unique display name inside the workflow
  string type = 3;         // fully-qualified: "<pluginId>.<nodeName>"
  int32 type_version = 4;
}

message PairedItem {
  int32 item = 1;
  int32 input = 2;
}

message Item {
  DynamicValue json = 1;   // the item payload (a JSON object)
  PairedItem paired_item = 2;
  DynamicValue binary = 3; // optional: files by property name, { <name>: BinaryRef } (docs/protocol.md §11)
}

// Where a plugin reads and writes the bytes of item files during one Execute call:
// GET {url}/{id} and POST {url}, each with `Authorization: Bearer {token}`.
message BinaryAccess {
  string url = 1;          // e.g. "http://127.0.0.1:3000/api/binary"
  string token = 2;        // scoped to this execution; expires
}

message Branch {
  repeated Item items = 1;
}

message ExecuteRequest {
  string protocol = 1;
  string execution_id = 2;
  string workflow_id = 3;
  string mode = 4;                               // "manual" | "trigger" | "webhook" | "tool" | "chat" | "poll" | "mcp"
  NodeRef node = 5;
  DynamicValue parameters = 6;                   // resolved against item 0 (or no item)
  repeated DynamicValue item_parameters = 7;     // resolved per item of input 0
  repeated Branch inputs = 8;                    // inputs[i] = items arriving on main input i
  DynamicValue credentials = 9;                  // optional: { <credentialType>: { ...decrypted fields } }
  DynamicValue poll_state = 10;                  // poll triggers: state returned by the previous poll
  bool continue_on_fail = 11;                    // emit { json: { error } } for a failing item and go on
  BinaryAccess binary_access = 12;               // optional: the host's binary API for this call
  string idempotency_key = 13;                   // "<executionId>:<nodeId>:<runIndex>", same across retries; empty from older hosts
}

message LogEntry {
  string level = 1;        // "debug" | "info" | "warn" | "error"
  string message = 2;
}

message NodeError {
  string message = 1;
  string description = 2;
  int32 item_index = 3;    // -1 when not item-specific
}

message ExecuteResponse {
  repeated Branch outputs = 1;   // outputs[i] = items emitted on main output i
  repeated LogEntry logs = 2;
  NodeError error = 3;           // set when the node failed as a whole
  DynamicValue poll_state = 4;   // poll triggers: state for the next poll
  repeated DynamicValue records = 5; // each: a NodeRecord JSON object (artifact or check, docs/protocol.md)
}

// ---- Load options -----------------------------------------------------

message LoadOptionsRequest {
  string node_type = 1;            // local node name (without plugin prefix)
  string method = 2;
  DynamicValue parameters = 3;     // current (unresolved) parameter values
  DynamicValue credentials = 4;    // optional, same shape as ExecuteRequest.credentials
}

message LoadOptionsResponse {
  DynamicValue options = 1;        // JSON array of { name, value, description? }
}

// ---- Credentials ------------------------------------------------------

message TestCredentialsRequest {
  string credential_type = 1;      // local credential type name
  DynamicValue data = 2;           // the credential values to test
}

message TestCredentialsResponse {
  bool ok = 1;
  string message = 2;
}

// ---- App webhook triggers --------------------------------------------

message WebhookMethodRequest {
  string protocol = 1;
  string method = 2;               // "checkExists" | "create" | "delete"
  string workflow_id = 3;
  NodeRef node = 4;
  DynamicValue parameters = 5;     // resolved without items
  DynamicValue credentials = 6;    // optional, same shape as ExecuteRequest.credentials
  string webhook_url = 7;          // where the service must call: {publicUrl}/api/webhook/app/<workflowId>/<nodeId>
  DynamicValue static_data = 8;    // what the node stored so far ({} at first)
}

message WebhookMethodResponse {
  bool exists = 1;                 // checkExists: the webhook is registered
  DynamicValue static_data = 2;    // the node's static data after the call; absent = unchanged
  repeated LogEntry logs = 3;
  NodeError error = 4;
}

message IncomingWebhookRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3; // lower-case names
  map<string, string> query = 4;
  bytes body = 5;                  // raw, exactly as sent (signatures cover these bytes)
}

message ReceiveWebhookRequest {
  string protocol = 1;
  string workflow_id = 2;
  NodeRef node = 3;
  DynamicValue parameters = 4;
  DynamicValue credentials = 5;
  string webhook_url = 6;
  DynamicValue static_data = 7;
  IncomingWebhookRequest request = 8;
}

message WebhookReply {
  int32 status = 1;                // 0 = 200
  map<string, string> headers = 2;
  bytes body = 3;
}

message ReceiveWebhookResponse {
  repeated Item items = 1;         // the trigger's output for a new run; none = no run
  WebhookReply response = 2;       // absent: 200 with the run's id
  DynamicValue static_data = 3;    // absent = unchanged
  string idempotency_key = 4;      // identifies the event: a redelivery starts no second run
  repeated LogEntry logs = 5;
  NodeError error = 6;
}

// ---- Health -----------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  string status = 1;       // "ok" | "degraded"
  int64 uptime_ms = 2;
  string plugin_id = 3;
  string version = 4;
}

// ---- Registry ---------------------------------------------------------

message AnnounceRequest {
  string protocol = 1;
  string endpoint = 2;     // "http://127.0.0.1:7101" or "grpc://127.0.0.1:7203"
  string plugin_id = 3;
  string version = 4;
  int32 ttl_seconds = 5;   // lease; re-announce before it expires (default 30)
  string instance_id = 6;  // random per plugin process; a new one re-pulls the manifest (empty from older plugins)
}

message AnnounceResponse {
  bool accepted = 1;
  int32 heartbeat_interval_seconds = 2;
  string message = 3;
}

message WithdrawRequest {
  string endpoint = 1;
  string plugin_id = 2;
}

message WithdrawResponse {
  bool ok = 1;
}
