[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "landflow-sdk"
version = "0.1.0"
description = "Build Landflow workflow nodes in Python, served over HTTP (stdlib) or gRPC, with built-in tracing, metrics and credentials."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.optional-dependencies]
# The committed stubs in landflow_sdk/_pb: plugin_pb2_grpc.py from grpcio-tools 1.84.1, plugin_pb2.py from
# protoc 36.2 (protobuf gencode 7.36.2). They refuse to import on older runtimes.
grpc = ["grpcio>=1.84.1", "protobuf>=7.36.2,<8"]
# OpenTelemetry SDK + OTLP/HTTP exporter. Without it the SDK still traces, logs with trace ids
# and serves /metrics (built-in mode); with it spans/metrics are exported over OTLP.
# For OTEL_EXPORTER_OTLP_PROTOCOL=grpc also install opentelemetry-exporter-otlp-proto-grpc.
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
# The MCP face (landflow_sdk.mcp): Streamable HTTP at /mcp and --mcp-stdio, on the official mcp package (2026-07-28 and
# 2025-era clients). Without it the face is off and serve() logs one line.
mcp = ["mcp==2.3.0"]
# The messaging core (landflow_sdk.transport): AES-256-GCM sealing of what goes over a broker. Every broker extra brings it.
transport = ["cryptography>=50.0.2"]
# Native tier 1 drivers (landflow_sdk.transport.drivers); kinds without one go through landflow-bridge (landflow_sdk.bridge).
kafka = ["cryptography>=50.0.2", "confluent-kafka>=2.16.0"]
amqp = ["cryptography>=50.0.2", "pika>=1.4.4"]
nats = ["cryptography>=50.0.2", "nats-py>=2.16.0"]
valkey = ["cryptography>=50.0.2", "valkey>=6.2.0"]
brokers = ["cryptography>=50.0.2", "confluent-kafka>=2.16.0", "pika>=1.4.4", "nats-py>=2.16.0", "valkey>=6.2.0"]
dev = ["grpcio-tools>=1.84.1"]

[tool.setuptools]
packages = ["landflow_sdk", "landflow_sdk._pb", "landflow_sdk.transport", "landflow_sdk.transport.drivers"]

[tool.setuptools.package-data]
landflow_sdk = ["py.typed"]
"landflow_sdk._pb" = ["*.pyi"]
